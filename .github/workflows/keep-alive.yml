name: Manter Render Ativo

on:
  # Brasil (BRT) = UTC-3.
  # 7-16 UTC corresponde a 4:00-13:59 no Brasil.
  # Executa a cada 5 minutos, começando no minuto 2, somente nesse período.
  schedule:
    - cron: '2-59/5 7-16 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: manter-render-ativo
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verificar saúde do Render
        shell: bash
        run: |
          set -u
          url="https://pamonha-net-fidelidade.onrender.com/api/health"

          for attempt in 1 2 3; do
            status="$(curl --silent --show-error --location \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 20 \
              --max-time 75 \
              "$url" || true)"

            echo "Tentativa ${attempt}: HTTP ${status:-sem resposta}"

            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              exit 0
            fi

            [[ "$attempt" -lt 3 ]] && sleep 10
          done

          echo "O endpoint de saúde não respondeu com HTTP 2xx."
          exit 1
