<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2E3A22" />
  <meta name="description" content="Cartão fidelidade digital da Pamonha Net. Junte selos a cada compra e troque por prêmios." />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>Pamonha Net · Fidelidade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* -- Paleta: milho vivo, palha e terra (ajustada para amarelo e verde mais claros) -- */
      --paper: #FFE14D;
      --paper-deep: #FFD400;
      --cream-card: #FFFDF5;
      --husk-900: #4F7A2E;
      --husk-700: #6B9A3E;
      --husk-500: #8FB863;
      --husk-300: #E2F0C7;
      --gold-700: #A9720B;
      --gold-600: #E0A215;
      --gold-300: #FFE38A;
      --gold-100: #FFF3CF;
      --clay-600: #A2653A;
      --clay-100: #F1E0CE;
      --ink: #2A2118;
      --ink-soft: #6D6151;
      --ink-faint: #8C7F68;
      --line: rgba(79, 122, 46, 0.2);
      --line-soft: rgba(79, 122, 46, 0.1);
      --success: #4C7A34;
      --error: #B23A22;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --ease: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'Work Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--ink);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #app { min-height: 100vh; display: flex; flex-direction: column; }
    button, input, textarea { font-family: inherit; }
    a { color: inherit; }

    .hidden { display: none !important; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .gap-1 { gap: 0.5rem; }
    .gap-2 { gap: 1rem; }
    .w-full { width: 100%; }
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1.5rem; }
    .mb-1 { margin-bottom: 0.5rem; }
    .mb-2 { margin-bottom: 1.25rem; }
    .p-1 { padding: 0.75rem; }
    .p-2 { padding: 1.25rem; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .text-sm { font-size: 0.875rem; }
    .text-xs { font-size: 0.78rem; }
    .font-bold { font-weight: 600; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .muted { color: var(--ink-soft); }

    /* -- Icon system -- */
    .icon, .logo-seal, .auth-seal { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; flex-shrink: 0; }
    .icon-sm { width: 16px; height: 16px; }
    .icon-lg { width: 28px; height: 28px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes stampIn {
      0% { transform: scale(0.4) rotate(-14deg); opacity: 0; }
      55% { transform: scale(1.08) rotate(4deg); opacity: 1; }
      100% { transform: scale(1) rotate(var(--jit, 0deg)); opacity: 1; }
    }
    @keyframes ringPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(201, 154, 46, 0.35); }
      50% { box-shadow: 0 0 0 10px rgba(201, 154, 46, 0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .page { animation: fadeIn 0.4s ease both; }

    .container { max-width: 460px; margin: 0 auto; width: 100%; padding: 1.1rem 1.1rem 0; flex: 1; }
    .pb-nav { padding-bottom: 92px; }

    /* -- Header -- */
    .app-header {
      background: var(--husk-900);
      color: var(--gold-300);
      padding: 0.95rem 1.1rem;
      display: flex; align-items: center; gap: 0.65rem;
      position: sticky; top: 0; z-index: 40;
      border-bottom: 3px solid var(--gold-600);
    }
    .app-header .wordmark {
      font-family: var(--font-display); font-weight: 600; font-size: 1.15rem;
      color: #fff; letter-spacing: 0.2px;
    }
    .app-header .tagline { font-size: 0.68rem; color: var(--husk-300); letter-spacing: 0.2px; }
    .logo-seal { width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%; object-fit: cover; }

    /* -- Bottom nav -- */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--husk-900);
      display: flex; padding: 0.5rem 0.6rem calc(0.5rem + env(safe-area-inset-bottom));
      z-index: 50; gap: 0.25rem;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 0.64rem; color: var(--husk-300); text-decoration: none; font-weight: 500;
      transition: color var(--ease); border: none; background: none; cursor: pointer;
      padding: 0.45rem 0.2rem; border-radius: 12px; position: relative;
    }
    .nav-item .icon { width: 21px; height: 21px; }
    .nav-item.active { color: var(--gold-300); background: rgba(201, 154, 46, 0.16); }

    /* -- Surfaces -- */
    .surface {
      background: var(--cream-card);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 1.15rem;
    }
    .surface-title {
      font-family: var(--font-display); font-weight: 600; font-size: 1.02rem;
      color: var(--husk-900); margin-bottom: 0.85rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .page-title {
      font-family: var(--font-display); font-weight: 600; font-size: 1.35rem;
      color: var(--husk-900); margin: 0.9rem 0 1rem; display: flex; align-items: center; gap: 0.55rem;
    }
    .page-title .icon { color: var(--gold-700); width: 24px; height: 24px; }

    /* -- Buttons -- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      width: 100%; padding: 0.95rem 1rem; border: none; border-radius: var(--radius-sm);
      font-size: 0.96rem; font-weight: 600; cursor: pointer; transition: transform var(--ease), filter var(--ease);
      font-family: var(--font-body);
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--gold-600); color: var(--husk-900); }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-secondary { background: var(--husk-900); color: var(--gold-300); }
    .btn-danger { background: transparent; color: var(--error); border: 1.5px solid rgba(168, 67, 43, 0.4); }
    .btn-success { background: var(--husk-700); color: #fff; }
    .btn-outline { background: transparent; border: 1.5px solid var(--line); color: var(--husk-900); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none !important; }

    /* -- Inputs -- */
    .input {
      width: 100%; padding: 0.85rem 1rem; border: 1.5px solid var(--line);
      border-radius: var(--radius-sm); font-size: 0.96rem; background: #fff; color: var(--ink);
      transition: border-color var(--ease), box-shadow var(--ease); outline: none;
    }
    .input:focus { border-color: var(--gold-600); box-shadow: 0 0 0 3px rgba(201, 154, 46, 0.18); }
    .input::placeholder { color: var(--ink-faint); }
    .label { display: block; margin-bottom: 0.35rem; font-weight: 600; font-size: 0.82rem; color: var(--ink-soft); }

    /* -- Auth screens -- */
    .auth-wrap { min-height: calc(100vh - 60px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem 0 2rem; }
    .auth-seal { width: 96px; height: 96px; margin-bottom: 0.6rem; border-radius: 50%; object-fit: cover; box-shadow: 0 10px 24px -10px rgba(79,122,46,0.5); }
    .auth-wrap h1 { font-family: var(--font-display); font-size: 1.55rem; font-weight: 600; color: var(--husk-900); text-align: center; }
    .auth-wrap .sub { color: var(--ink-soft); margin: 0.2rem 0 1.5rem; text-align: center; font-size: 0.92rem; }
    .auth-card { width: 100%; max-width: 360px; }
    .switch-link { text-align: center; margin-top: 1rem; font-size: 0.88rem; color: var(--ink-soft); }
    .switch-link button { background: none; border: none; color: var(--gold-700); font-weight: 600; cursor: pointer; font-size: inherit; text-decoration: underline; text-underline-offset: 2px; }

    /* -- Loyalty ticket card -- */
    .ticket-card {
      position: relative;
      background: var(--cream-card);
      border-radius: var(--radius-lg);
      padding: 1.4rem 1.25rem 1.6rem;
      text-align: center;
      box-shadow: 0 16px 32px -20px rgba(41, 51, 31, 0.45);
      border: 1px solid var(--line);
    }
    .ticket-card::before, .ticket-card::after {
      content: ''; position: absolute; left: 0; right: 0; height: 13px;
      background-image: radial-gradient(circle at 13px 6.5px, var(--paper) 6.5px, transparent 7px);
      background-size: 26px 13px; background-repeat: repeat-x;
    }
    .ticket-card::before { top: -7px; }
    .ticket-card::after { bottom: -7px; transform: rotate(180deg); }
    .ticket-label {
      display: inline-flex; align-items: center; gap: 0.4rem;
      color: var(--husk-700); font-weight: 700; font-size: 0.78rem;
      letter-spacing: 0.4px; margin-bottom: 0.9rem;
    }
    .ticket-label .icon { width: 16px; height: 16px; color: var(--gold-700); }

    .fidelity-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.65rem; margin-bottom: 0.5rem; }
    .stamp-slot {
      aspect-ratio: 1; border-radius: 50%;
      background: transparent; border: 1.5px dashed var(--ink-faint);
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-faint); transition: var(--ease);
    }
    .stamp-slot .icon { width: 58%; height: 58%; }
    .stamp-slot .stamp-img { width: 72%; height: 72%; object-fit: contain; }
    .stamp-slot.winner .stamp-img { filter: brightness(0) saturate(100%) invert(88%) sepia(28%) saturate(500%) hue-rotate(1deg); }
    .stamp-slot.filled {
      background: var(--gold-100); border: 1.5px solid var(--gold-600); color: var(--husk-900);
      animation: stampIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .stamp-slot.winner {
      background: var(--husk-700); border-color: var(--husk-900); color: var(--gold-300);
      animation: stampIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both, ringPulse 2.2s 0.6s infinite;
    }
    .card-status { font-weight: 600; color: var(--husk-700); margin-top: 0.7rem; font-size: 0.9rem; }
    .card-status.complete { color: var(--husk-900); }

    /* -- QR -- */
    .qr-wrap {
      background: var(--cream-card); padding: 1.25rem; border-radius: var(--radius-md);
      display: flex; flex-direction: column; align-items: center; gap: 0.7rem;
      border: 1px solid var(--line); text-align: center;
    }
    .qr-wrap img { max-width: 230px; width: 100%; border-radius: 10px; border: 1px solid var(--line); }

    /* -- Live QR scanner (admin) -- */
    .scan-frame {
      position: relative; width: 100%; aspect-ratio: 1; border-radius: var(--radius-md);
      overflow: hidden; background: #10160b; border: 2px solid var(--husk-900);
    }
    .scan-frame video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .scan-reticle {
      position: absolute; inset: 14%; border: 3px solid var(--gold-300); border-radius: 18px;
      box-shadow: 0 0 0 2000px rgba(0,0,0,0.28); pointer-events: none;
    }
    .scan-flash {
      position: absolute; inset: 0; background: var(--husk-700); opacity: 0; pointer-events: none;
      transition: opacity 0.15s ease;
    }
    .scan-flash.hit { opacity: 0.55; }
    details > summary::-webkit-details-marker { display: none; }

    /* -- Toast -- */
    .toast {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-130%);
      background: var(--husk-900); color: #fff; padding: 0.85rem 1.3rem;
      border-radius: 12px; font-weight: 500; font-size: 0.9rem; z-index: 100;
      box-shadow: 0 10px 28px rgba(0,0,0,0.25); transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
      max-width: 88vw; text-align: center; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--husk-700); }
    .toast.error { background: var(--error); }

    /* -- Rows: notifications, history, clients -- */
    .row {
      background: var(--cream-card); border-radius: var(--radius-sm); padding: 0.95rem 1rem; margin-bottom: 0.6rem;
      border: 1px solid var(--line); border-left: 3px solid var(--gold-600);
    }
    .row.is-read { border-left-color: var(--line); opacity: 0.72; }
    .row h4 { font-size: 0.93rem; font-weight: 600; margin-bottom: 0.2rem; color: var(--ink); }
    .row p { font-size: 0.85rem; color: var(--ink-soft); line-height: 1.4; }
    .row-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 0.55rem; }
    .row-foot .text-xs { color: var(--ink-faint); }
    .link-btn {
      background: none; border: none; color: var(--husk-700); font-weight: 600; font-size: 0.78rem;
      cursor: pointer; display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.2rem;
    }

    .rate-cta {
      width: 100%; display: flex; align-items: center; gap: 0.75rem; text-align: left;
      background: linear-gradient(135deg, var(--gold-300), var(--gold-100));
      border: 1.5px solid var(--gold-600); border-radius: var(--radius-md);
      padding: 0.85rem 1rem; cursor: pointer; color: var(--husk-900); font-family: inherit;
    }
    .rate-cta:active { transform: scale(0.98); }
    .rate-cta-icon { color: var(--gold-700); flex-shrink: 0; }
    .rate-cta-text { display: flex; flex-direction: column; flex: 1; line-height: 1.3; }
    .rate-cta-text strong { font-size: 0.92rem; }
    .rate-cta-text span:last-child { font-size: 0.78rem; color: var(--husk-700); }
    .rate-cta-arrow { color: var(--gold-700); flex-shrink: 0; }

    /* -- Modal (confirmações críticas) -- */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(30, 22, 12, 0.55); z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 1.2rem;
      animation: fadeIn 0.2s ease both;
    }
    .modal-card {
      background: var(--cream-card); border-radius: var(--radius-md); padding: 1.3rem;
      width: 100%; max-width: 360px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    /* -- Splash de abertura -- */
    .splash-overlay {
      position: fixed; inset: 0; background: var(--paper); z-index: 300;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.5s ease;
    }
    .splash-overlay.splash-out { opacity: 0; pointer-events: none; }
    .splash-card-wrap { width: 100%; max-width: 320px; padding: 0 1.5rem; perspective: 1200px; }
    .splash-card {
      position: relative; width: 100%; min-height: 260px; transform-style: preserve-3d;
      transition: transform 0.9s cubic-bezier(0.4, 0.1, 0.2, 1);
    }
    .splash-card.is-flipped { transform: rotateY(180deg); }
    .splash-face {
      position: absolute; inset: 0; backface-visibility: hidden;
      background: var(--cream-card); border-radius: var(--radius-lg); border: 1px solid var(--line);
      box-shadow: 0 16px 32px -18px rgba(41,51,31,0.4);
      padding: 1.4rem 1.1rem; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .splash-front { text-align: center; }
    .splash-front .fidelity-grid { width: 100%; margin-top: 0.4rem; }
    .splash-back { transform: rotateY(180deg); text-align: center; color: var(--husk-900); }
    .splash-back p { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; line-height: 1.4; }

    .empty-state { text-align: center; padding: 2.2rem 1rem; color: var(--ink-soft); }
    .empty-state .icon { width: 34px; height: 34px; color: var(--ink-faint); margin: 0 auto 0.6rem; }
    .empty-state p { font-size: 0.88rem; max-width: 260px; margin: 0 auto; }

    /* -- Ranking -- */
    .rank-list { background: var(--cream-card); border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
    .rank-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; border-bottom: 1px solid var(--line-soft); }
    .rank-row:last-child { border-bottom: none; }
    .rank-row.is-self { background: var(--gold-100); }
    .rank-pos { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: var(--husk-700); width: 2rem; text-align: center; flex-shrink: 0; }
    .rank-name { flex: 1; font-weight: 600; font-size: 0.92rem; color: var(--ink); }
    .rank-count { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--gold-700); }

    /* -- Admin: inactivity badge + WhatsApp -- */
    .inactive-badge {
      display: inline-flex; align-items: center; gap: 0.3rem; background: rgba(178,58,34,0.12);
      color: var(--error); font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.55rem;
      border-radius: 999px; margin-top: 0.3rem;
    }

    /* -- Stars -- */
    .fb-question-title { font-weight: 600; font-size: 0.92rem; color: var(--husk-900); text-align: center; margin-bottom: 0.3rem; }
    .stars { display: flex; gap: 0.5rem; justify-content: center; margin: 0.3rem 0 0.2rem; }
    .star-btn { background: none; border: none; cursor: pointer; padding: 0.2rem; color: var(--line); transition: transform 0.15s ease, color var(--ease); }
    .star-btn:active { transform: scale(1.25); }
    .star-btn .icon { width: 28px; height: 28px; }
    .star-btn.active { color: var(--gold-600); }
    .star-btn.active .icon { fill: currentColor; }

    /* -- Admin -- */
    .client-row { background: var(--cream-card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 0.9rem; margin-bottom: 0.6rem; }
    .client-row .top { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .client-row .name { font-weight: 600; font-size: 0.94rem; color: var(--ink); }
    .client-row .phone { font-size: 0.8rem; color: var(--ink-soft); margin-top: 1px; }
    .client-row .count { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; color: var(--gold-700); flex-shrink: 0; }
    .client-row .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.75rem; }
    .client-row .actions .btn { width: auto; flex: 1; min-width: 74px; padding: 0.55rem; font-size: 0.76rem; gap: 0.3rem; }
    .section-gap { margin-bottom: 1.1rem; }
    .cleanup-row {
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
      padding: 0.65rem 0; border-bottom: 1px solid var(--line-soft);
    }
    .cleanup-row:last-child { border-bottom: none; }
    .cleanup-row div { display: flex; flex-direction: column; }
    .cleanup-row strong { font-size: 0.86rem; color: var(--ink); }
    .cleanup-row span { font-size: 0.75rem; color: var(--ink-soft); }
    .cleanup-row .btn { width: auto; padding: 0.5rem 0.9rem; font-size: 0.78rem; flex-shrink: 0; }

    /* -- Audience picker (admin notifications) -- */
    .audience-toggle { display: flex; gap: 0.5rem; }
    .audience-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      padding: 0.6rem 0.5rem; border-radius: var(--radius-sm); border: 1.5px solid var(--line);
      background: #fff; color: var(--ink-soft); font-weight: 600; font-size: 0.8rem; cursor: pointer;
    }
    .audience-btn.active { background: var(--husk-900); border-color: var(--husk-900); color: var(--gold-300); }
    .notif-client-list { display: flex; flex-direction: column; gap: 0.3rem; max-height: 190px; overflow-y: auto; }
    .notif-client-item {
      display: flex; justify-content: space-between; align-items: center; width: 100%;
      background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 0.55rem 0.75rem;
      font-size: 0.85rem; color: var(--ink); cursor: pointer; text-align: left;
    }
    .notif-client-item:active { background: var(--gold-100); }
    .notif-chip {
      display: inline-flex; align-items: center; gap: 0.4rem; background: var(--gold-100);
      border: 1px solid var(--gold-600); color: var(--husk-900); font-weight: 600; font-size: 0.82rem;
      padding: 0.35rem 0.5rem 0.35rem 0.75rem; border-radius: 999px;
    }
    .notif-chip button { background: none; border: none; font-size: 1.1rem; line-height: 1; cursor: pointer; color: var(--husk-700); padding: 0 0.15rem; }

    /* -- Feedback cards (admin) -- */
    .fb-card { background: var(--cream-card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 0.9rem; margin-bottom: 0.65rem; }
    .fb-card-head { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.7rem; }
    .fb-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: var(--husk-900); color: var(--gold-300);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: var(--font-display);
      flex-shrink: 0; font-size: 1rem;
    }
    .fb-avg { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; flex-shrink: 0; }
    .fb-breakdown { display: flex; flex-direction: column; gap: 0.32rem; padding: 0.6rem 0.7rem; background: var(--paper); border-radius: 10px; }
    .fb-line { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; color: var(--husk-900); font-weight: 500; }
    .fb-line > span:first-child { color: var(--ink-soft); }
    .fb-comment { font-size: 0.87rem; color: var(--ink-soft); font-style: italic; margin-top: 0.65rem; line-height: 1.4; }

    ::-webkit-scrollbar { width: 0; background: transparent; }

    .loader { width: 32px; height: 32px; border: 3px solid var(--gold-100); border-top-color: var(--gold-600); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 1.2rem auto; }

    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; }
    .confetti-piece { position: absolute; width: 7px; height: 7px; animation: confettiFall 2.4s ease-out forwards; }
    @keyframes confettiFall { 0% { transform: translateY(-8vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(600deg); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
    :focus-visible { outline: 2px solid var(--gold-700); outline-offset: 2px; }
  </style>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    const API_URL = '';
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));
    const icon = (name, cls='icon') => `<svg class="${cls}"><use href="#i-${name}"/></svg>`;

    const toast = {
      el: $('#toast'),
      timer: null,
      show(msg, type='success') {
        this.el.textContent = msg;
        this.el.className = `toast ${type} show`;
        clearTimeout(this.timer);
        this.timer = setTimeout(() => this.el.classList.remove('show'), 3000);
      }
    };

    function formatPhone(n) {
      if (!n || n.length < 10) return n;
      return n.length === 11
        ? `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`
        : `(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}`;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    }

    const api = {
      token: localStorage.getItem('pnf_token') || null,
      user: JSON.parse(localStorage.getItem('pnf_user') || 'null'),
      setAuth(t, u) {
        this.token = t; this.user = u;
        if (t) localStorage.setItem('pnf_token', t);
        if (u) localStorage.setItem('pnf_user', JSON.stringify(u));
      },
      clearAuth() {
        this.token = null; this.user = null;
        localStorage.removeItem('pnf_token'); localStorage.removeItem('pnf_user');
      },
      async req(method, endpoint, body=null) {
        const opts = { method, headers: { 'Content-Type': 'application/json' } };
        if (this.token) opts.headers['Authorization'] = 'Bearer ' + this.token;
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(API_URL + endpoint, opts);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Não foi possível concluir. Tente novamente.');
        return data;
      },
      get(endpoint) { return this.req('GET', endpoint); },
      post(endpoint, body) { return this.req('POST', endpoint, body); },
      put(endpoint, body) { return this.req('PUT', endpoint, body); },
      del(endpoint) { return this.req('DELETE', endpoint); }
    };

    const router = {
      routes: {},
      current: '',
      register(path, renderFn) { this.routes[path] = renderFn; },
      go(path, skipHistory=false) {
        this.current = path;
        if (!skipHistory) history.pushState(null, '', '#'+path);
        else history.replaceState(null, '', '#'+path);
        this.render();
      },
      render() {
        if (typeof stopScanner === 'function') stopScanner();
        const hash = location.hash.replace('#','') || 'card';
        const fn = this.routes[hash] || this.routes['card'];
        $('#main-container').innerHTML = '';
        fn($('#main-container'));
        $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === hash));
        window.scrollTo(0,0);
      }
    };

    window.addEventListener('popstate', () => router.render());

    router.register('login', (container) => {
      container.innerHTML = `
        <div class="page auth-wrap">
          <img class="auth-seal" src="/logo.png" alt="Pamonha Net" />
          <h1>Pamonha Net</h1>
          <p class="sub">Entre para ver seu cartão e seus selos</p>
          <div class="surface auth-card">
            <div class="mb-1"><label class="label">Telefone ou e-mail</label>
              <input class="input" id="login-id" placeholder="(21) 91234-5678 ou seu@email.com" />
            </div>
            <div class="mb-1"><label class="label">Senha</label>
              <input class="input" id="login-pass" placeholder="Mínimo 6 caracteres" type="password" />
            </div>
            <div class="text-right mb-2"><button class="link-btn" style="padding:0" onclick="router.go('forgot')">Esqueci minha senha</button></div>
            <button class="btn btn-primary" id="btn-login">Entrar</button>
          </div>
          <div class="switch-link">Ainda não tem cartão? <button onclick="router.go('register')">Criar conta</button></div>
        </div>
      `;
      $('#login-id').addEventListener('keydown', e => { if (e.key === 'Enter') $('#login-pass').focus(); });
      $('#login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btn-login').click(); });
      $('#btn-login').onclick = async () => {
        const identifier = $('#login-id').value.trim();
        const pass = $('#login-pass').value;
        if (!identifier || !pass) return toast.show('Preencha telefone/e-mail e senha.', 'error');
        try {
          const data = await api.post('/api/auth/login', { identifier, password: pass });
          api.setAuth(data.token, data.user);
          toast.show('Bem-vindo de volta, ' + data.user.fullName.split(' ')[0] + '!');
          updateNav();
          router.go('card', true);
        } catch (e) { toast.show(e.message, 'error'); }
      };
    });

    router.register('register', (container) => {
      container.innerHTML = `
        <div class="page auth-wrap">
          <img class="auth-seal" src="/logo.png" alt="Pamonha Net" />
          <h1>Criar conta</h1>
          <p class="sub">Leva menos de um minuto</p>
          <div class="surface auth-card">
            <div class="mb-1"><label class="label">Nome completo</label>
              <input class="input" id="reg-name" placeholder="Seu nome" />
            </div>
            <div class="mb-1"><label class="label">Telefone</label>
              <input class="input" id="reg-phone" placeholder="(21) 91234-5678" type="tel" inputmode="tel" />
            </div>
            <div class="mb-1"><label class="label">E-mail</label>
              <input class="input" id="reg-email" placeholder="seu@email.com" type="email" />
            </div>
            <div class="mb-2"><label class="label">Senha</label>
              <input class="input" id="reg-pass" placeholder="Mínimo 6 caracteres" type="password" />
            </div>
            <button class="btn btn-primary" id="btn-reg">Criar minha conta</button>
          </div>
          <div class="switch-link">Já tem cartão? <button onclick="router.go('login')">Entrar</button></div>
        </div>
      `;
      $('#btn-reg').onclick = async () => {
        const fullName = $('#reg-name').value.trim();
        const phone = $('#reg-phone').value.trim();
        const email = $('#reg-email').value.trim();
        const password = $('#reg-pass').value;
        if (!fullName || !phone || !email || !password) return toast.show('Preencha todos os campos.', 'error');
        try {
          const data = await api.post('/api/auth/register', { fullName, phone, email, password });
          api.setAuth(data.token, data.user);
          toast.show('Conta criada! Seu cartão já está pronto.');
          updateNav();
          router.go('card', true);
        } catch (e) { toast.show(e.message, 'error'); }
      };
    });

    router.register('forgot', (container) => {
      container.innerHTML = `
        <div class="page auth-wrap">
          <img class="auth-seal" src="/logo.png" alt="Pamonha Net" />
          <h1>Recuperar senha</h1>
          <p class="sub">Informe seu telefone ou e-mail cadastrado</p>
          <div class="surface auth-card">
            <div class="mb-2"><label class="label">Telefone ou e-mail</label>
              <input class="input" id="forgot-id" placeholder="(21) 91234-5678 ou seu@email.com" />
            </div>
            <button class="btn btn-primary" id="btn-forgot">Enviar link de redefinição</button>
          </div>
          <div class="switch-link"><button onclick="router.go('login')">Voltar para o login</button></div>
        </div>
      `;
      $('#btn-forgot').onclick = async () => {
        const identifier = $('#forgot-id').value.trim();
        if (!identifier) return toast.show('Informe telefone ou e-mail.', 'error');
        try {
          const data = await api.post('/api/auth/forgot-password', { identifier });
          toast.show(data.message);
          router.go('login');
        } catch (e) { toast.show(e.message, 'error'); }
      };
    });

    router.register('reset', (container) => {
      const params = new URLSearchParams(location.search);
      const token = params.get('reset') || '';
      container.innerHTML = `
        <div class="page auth-wrap">
          <img class="auth-seal" src="/logo.png" alt="Pamonha Net" />
          <h1>Nova senha</h1>
          <p class="sub">Escolha uma nova senha para sua conta</p>
          <div class="surface auth-card">
            <div class="mb-2"><label class="label">Nova senha</label>
              <input class="input" id="reset-pass" placeholder="Mínimo 6 caracteres" type="password" />
            </div>
            <button class="btn btn-primary" id="btn-reset">Salvar nova senha</button>
          </div>
        </div>
      `;
      $('#btn-reset').onclick = async () => {
        const password = $('#reset-pass').value;
        if (!password || password.length < 6) return toast.show('A senha precisa ter pelo menos 6 caracteres.', 'error');
        try {
          const data = await api.post('/api/auth/reset-password', { token, password });
          toast.show(data.message);
          history.replaceState(null, '', location.pathname);
          router.go('login');
        } catch (e) { toast.show(e.message, 'error'); }
      };
    });

    router.register('card', (container) => {
      if (!api.token) return router.go('login');
      container.innerHTML = `
        <div class="page">
          <div class="text-center mt-1 mb-1">
            <h2 style="font-family:var(--font-display); font-weight:600; font-size:1.2rem; color:var(--husk-900)">Olá, <span id="card-name">...</span></h2>
            <p class="text-sm muted">A cada compra, um selo mais perto do prêmio</p>
          </div>
          <div class="ticket-card">
            <div class="ticket-label">${icon('kernel')} Cartão Pamonha Net</div>
            <div class="fidelity-grid" id="stamp-grid"></div>
            <div class="card-status" id="card-status"></div>
          </div>
          <div class="qr-wrap mt-2 hidden" id="qr-area">
            <p class="text-sm font-bold" style="color:var(--husk-900)">Mostre este QR Code no balcão</p>
            <img id="qr-img" alt="QR Code para acúmulo de selo" />
            <p class="text-xs muted">Válido por 5 minutos</p>
            <button class="btn btn-outline" onclick="generateQr()">${icon('refresh', 'icon icon-sm')} Gerar novo QR Code</button>
          </div>
          <button class="btn btn-primary mt-2" id="btn-qr" onclick="generateQr()">${icon('qr', 'icon icon-sm')} Gerar QR Code</button>

          <button class="rate-cta mt-2" onclick="router.go('feedback')">
            <span class="rate-cta-icon">${icon('star', 'icon')}</span>
            <span class="rate-cta-text">
              <strong>Como foi sua experiência?</strong>
              <span>Avalie em 10 segundos</span>
            </span>
            <span class="rate-cta-arrow">${icon('send', 'icon icon-sm')}</span>
          </button>

          <button class="rate-cta mt-1" style="background:linear-gradient(135deg, var(--husk-300), var(--cream-card)); border-color:var(--husk-500)" onclick="router.go('ranking')">
            <span class="rate-cta-icon" style="color:var(--husk-700)">${icon('trophy', 'icon')}</span>
            <span class="rate-cta-text">
              <strong id="completed-line">Cartões fechados: 0</strong>
              <span style="color:var(--husk-700)">Ver ranking dos clientes</span>
            </span>
            <span class="rate-cta-arrow" style="color:var(--husk-700)">${icon('send', 'icon icon-sm')}</span>
          </button>

          <div class="mt-2">
            <h3 class="surface-title" style="margin-bottom:0.6rem">${icon('history', 'icon icon-sm')} Histórico recente</h3>
            <div id="history-list"></div>
          </div>
        </div>
      `;
      loadCard();
    });

    async function loadCard() {
      try {
        const data = await api.get('/api/client/dashboard');
        $('#card-name').textContent = data.fullName.split(' ')[0];
        renderStamps(data.stamps);
        const completedLine = $('#completed-line');
        if (completedLine) {

          list.innerHTML = `<div class="empty-state">${icon('history', 'icon')}<p>Seu histórico de selos aparece aqui assim que você fizer sua primeira compra.</p></div>`;

    function renderStamps(count) {
      const grid = $('#stamp-grid');
      grid.innerHTML = '';
      const jitters = [-4,3,-2,5,-3,2,-5,4,-1,0];
      for (let i = 0; i < 10; i++) {
        const div = document.createElement('div');
        const isWinner = i === 9 && count >= 10;
        div.className = 'stamp-slot' + (i < count ? (isWinner ? ' winner' : ' filled') : '');
        if (i < count) {
          div.style.setProperty('--jit', jitters[i] + 'deg');
          div.innerHTML = '<img src="/stamp.png" alt="" class="stamp-img" />';
        }
        grid.appendChild(div);
      }
    }

      for (let i = 0; i < 26; i++) {
        const p = document.createElement('div'); p.className = 'confetti-piece';
        p.style.left = Math.random() * 100 + '%';

        const message = isInactive
          ? `Saudades suas por aqui, ${firstName}! Faz um tempinho que você não passa pra carimbar seu cartão da Pamonha Net — ele te espera com ${client.stamps} selo${client.stamps === 1 ? '' : 's'}. Vem nos visitar!`
          : `Oi, ${firstName}! Aqui está o seu cartão fidelidade da Pamonha Net — você já tem ${client.stamps} de 10 selos. Continue firme rumo ao prêmio!`;

        canvas.toBlob(async (blob) => {
          const file = new File([blob], 'cartao-pamonha-net.png', { type: 'image/png' });
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], text: message, title: 'Pamonha Net' });
          } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'cartao-pamonha-net.png';
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(url);
            toast.show('Imagem baixada. Anexe no WhatsApp manualmente.');
          }
        }, 'image/png');
      } catch (e) { toast.show('Não foi possível gerar o cartão para compartilhar.', 'error'); }
    };

    // -- Seletor de destinatário da notificação --
    let notifAudience = 'all';
    let notifSelectedClient = null;

    window.setAudience = (mode) => {
      notifAudience = mode;
      $('#aud-all').classList.toggle('active', mode === 'all');
      $('#aud-one').classList.toggle('active', mode === 'one');
      $('#audience-picker').classList.toggle('hidden', mode !== 'one');
    };

    function matchesClientQuery(c, q) {
      const digits = q.replace(/\D/g, '');
      return c.fullName.toLowerCase().includes(q) || (digits.length > 0 && c.phone.includes(digits));
    }

    window.filterNotifClients = () => {
      const q = $('#notif-client-search').value.trim().toLowerCase();
      const list = $('#notif-client-list');
      if (!q) { list.innerHTML = ''; return; }
      const matches = adminClientCache.filter(c => matchesClientQuery(c, q)).slice(0, 6);
      list.innerHTML = matches.length
        ? matches.map(c => `
            <button class="notif-client-item" onclick='selectNotifClient(${JSON.stringify(c._id)}, ${JSON.stringify(c.fullName)})'>
              <span>${c.fullName}</span><span class="text-xs muted">${formatPhone(c.phone)}</span>
            </button>
          `).join('')
        : `<p class="text-xs muted p-1">Nenhum cliente encontrado.</p>`;
    };

    window.selectNotifClient = (id, name) => {
      notifSelectedClient = { id, name };
      $('#notif-client-list').innerHTML = '';
      $('#notif-client-search').value = '';
      $('#notif-selected-chip').innerHTML = `
        <span class="notif-chip">${name} <button onclick="clearNotifClient()" aria-label="Remover">×</button></span>
      `;
    };

    window.clearNotifClient = () => {
      notifSelectedClient = null;
      $('#notif-selected-chip').innerHTML = '';
    };

    window.searchClients = () => {
      const q = $('#search-clients').value.trim().toLowerCase();
      const filtered = adminClientCache.filter(c => matchesClientQuery(c, q));
      renderAdminClients(filtered);
    };

    window.addStamp = async (id) => {
      try {
        await api.post('/api/admin/clients/' + id + '/stamps', { action: 'add' });
        toast.show('Selo adicionado.');
        loadAdminClients();
      } catch (e) { toast.show(e.message, 'error'); }
    };
    window.removeStamp = async (id) => {
      try {
        await api.post('/api/admin/clients/' + id + '/stamps', { action: 'remove' });
        toast.show('Selo removido.');
        loadAdminClients();
      } catch (e) { toast.show(e.message, 'error'); }
    };
    window.resetCard = async (id) => {
      if (!confirm('Tem certeza que deseja zerar o cartão deste cliente?')) return;
      try {
        await api.post('/api/admin/clients/' + id + '/reset');
        toast.show('Cartão zerado.');
        loadAdminClients();
      } catch (e) { toast.show(e.message, 'error'); }
    };
    window.deleteHistory = async (id) => {
      if (!confirm('Apagar todo o histórico de selos deste cliente? Esta ação não pode ser desfeita.')) return;
      try {
        await api.del('/api/admin/clients/' + id + '/history');
        toast.show('Histórico apagado.');
      } catch (e) { toast.show(e.message, 'error'); }
    };

    window.scanQr = async () => {
      const raw = $('#qr-scan-input').value.trim();
      if (!raw) return toast.show('Cole o conteúdo do QR Code.', 'error');
      try {
        const data = await api.post('/api/admin/scan-qr', { qrToken: raw });
        toast.show(data.message || 'Selo adicionado via QR Code.');
        $('#qr-scan-input').value = '';
        loadAdminClients();
      } catch (e) { toast.show(e.message, 'error'); }
    };

    // -- Scanner de câmera ao vivo — feito para ser rápido no balcão/feira --
    // Usa a BarcodeDetector nativa do navegador quando disponível (mesmo decodificador
    // que a câmera do celular usa — reconhece na hora). Se o navegador não tiver isso
    // (ex: iPhone em versões mais antigas), cai para a biblioteca jsQR em resolução reduzida.
    let scannerStream = null;
    let scannerRAF = null;
    let scannerTimeout = null;
    let scannerCooldownUntil = 0;
    let scanCanvas = null;
    let nativeDetector = null;
    let nativeDetectorChecked = false;

    async function getNativeDetector() {
      if (nativeDetectorChecked) return nativeDetector;
      nativeDetectorChecked = true;
      if ('BarcodeDetector' in window) {
        try {
          const formats = await window.BarcodeDetector.getSupportedFormats();
          if (formats.includes('qr_code')) {
            nativeDetector = new window.BarcodeDetector({ formats: ['qr_code'] });
          }
        } catch (e) { nativeDetector = null; }
      }
      return nativeDetector;
    }

    async function startScanner() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment',
            // Resolução menor = cada frame processa muito mais rápido (a câmera nativa
            // usa hardware dedicado; no navegador precisamos limitar o tamanho da imagem
            // pra não travar a leitura).
            width: { ideal: 720 },
            height: { ideal: 720 },
          },
        });
        scannerStream = stream;
        const video = $('#scan-video');
        video.srcObject = stream;
        await video.play();
        $('#scanner-idle').classList.add('hidden');
        $('#scanner-active').classList.remove('hidden');
        await getNativeDetector();
        scanLoop();
      } catch (e) {
        toast.show('Não foi possível acessar a câmera. Use o código colado abaixo.', 'error');
      }
    }

    function stopScanner() {
      if (scannerRAF) cancelAnimationFrame(scannerRAF);
      if (scannerTimeout) clearTimeout(scannerTimeout);
      scannerRAF = null; scannerTimeout = null;
      if (scannerStream) {
        scannerStream.getTracks().forEach(t => t.stop());
        scannerStream = null;
      }
      const idle = $('#scanner-idle');
      const active = $('#scanner-active');
      if (idle) idle.classList.remove('hidden');
      if (active) active.classList.add('hidden');
    }

    async function scanLoop() {
      const video = $('#scan-video');
      if (!video || !scannerStream) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        try {
          if (nativeDetector) {
            // Caminho rápido: decodificador nativo do navegador, direto no frame de vídeo.
            const codes = await nativeDetector.detect(video);
            if (codes.length && Date.now() > scannerCooldownUntil) {
              handleScanResult(codes[0].rawValue);
            }
          } else if (window.jsQR) {
            // Caminho alternativo: reduzimos a imagem antes de decodificar — processar
            // em tamanho grande é o principal motivo da leitura ficar lenta no navegador.
            const maxDim = 480;
            const scale = Math.min(1, maxDim / Math.max(video.videoWidth, video.videoHeight));
            scanCanvas = scanCanvas || document.createElement('canvas');
            scanCanvas.width = Math.round(video.videoWidth * scale);
            scanCanvas.height = Math.round(video.videoHeight * scale);
            const ctx = scanCanvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);
            const imageData = ctx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
            const code = window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
            if (code && code.data && Date.now() > scannerCooldownUntil) {
              handleScanResult(code.data);
            }
          }
        } catch (e) { /* frame ruim, tenta o próximo */ }
      }

      // BarcodeDetector é leve o bastante pra rodar a cada frame; jsQR roda ~12x/seg
      // (rápido pra sentir instantâneo, mas sem sobrecarregar o celular do atendente).
      if (nativeDetector) {
        scannerRAF = requestAnimationFrame(scanLoop);
      } else {
        scannerTimeout = setTimeout(scanLoop, 80);
      }
    }

    async function handleScanResult(data) {
      scannerCooldownUntil = Date.now() + 1500;
      const flash = $('#scan-flash');
      const status = $('#scan-status');
      if (navigator.vibrate) navigator.vibrate(60);
      if (flash) { flash.classList.add('hit'); setTimeout(() => flash.classList.remove('hit'), 220); }
      if (status) status.textContent = 'Processando…';
      try {
        const res = await api.post('/api/admin/scan-qr', { qrToken: data });
        toast.show(res.message || 'Selo adicionado!');
        if (status) status.textContent = 'Selo adicionado! Pronto para o próximo cliente.';
        loadAdminClients();
      } catch (e) {
        toast.show(e.message, 'error');
        if (status) status.textContent = 'Procurando QR Code…';
      }
    }

    window.startScanner = startScanner;
    window.stopScanner = stopScanner;

    window.sendNotif = async () => {
      const title = $('#notif-title').value.trim();
      const message = $('#notif-msg').value.trim();
      if (!title || !message) return toast.show('Preencha título e mensagem.', 'error');
      if (notifAudience === 'one' && !notifSelectedClient) {
        return toast.show('Escolha um cliente ou mude para "Todos os clientes".', 'error');
      }
      try {
        const userId = notifAudience === 'one' ? notifSelectedClient.id : null;
        const data = await api.post('/api/admin/notifications', { title, message, userId });
        const pushInfo = data.push && data.push.sent ? ` (${data.push.sent} celular${data.push.sent > 1 ? 'es' : ''} notificado${data.push.sent > 1 ? 's' : ''})` : '';
        toast.show('Aviso enviado com sucesso.' + pushInfo);
        $('#notif-title').value = ''; $('#notif-msg').value = ''; $('#notif-msg-count').textContent = '0';
        clearNotifClient();
        setAudience('all');
      } catch (e) { toast.show(e.message, 'error'); }
    };

    window.clearNotifs = async (scope) => {
      const label = scope === 'all' ? 'todas as notificações' : scope === 'broadcast' ? 'as notificações gerais' : 'as notificações individuais';
      if (!confirm(`Tem certeza que deseja apagar ${label}?`)) return;
      try {
        await api.del('/api/admin/notifications?scope=' + scope);
        toast.show('Notificações removidas.');
      } catch (e) { toast.show(e.message, 'error'); }
    };

    async function loadAdminFeedbacks() {
      try {
        const data = await api.get('/api/admin/feedbacks');
        const box = $('#admin-feedbacks');
        if (!data.feedbacks.length) {
          box.innerHTML = `<div class="empty-state"><p>Nenhuma avaliação recebida ainda.</p></div>`;
          return;
        }
        const miniStars = (val) => [1,2,3,4,5].map(i => `<span style="color:${i <= val ? 'var(--gold-600)' : 'var(--line)'}"><svg class="icon" style="width:12px;height:12px;${i <= val ? 'fill:currentColor' : ''}"><use href="#i-star"/></svg></span>`).join('');
        const scoreColor = (avg) => avg >= 4 ? 'var(--husk-700)' : avg >= 3 ? 'var(--gold-700)' : 'var(--error)';

        box.innerHTML = data.feedbacks.map(f => `
          <div class="fb-card">
            <div class="fb-card-head">
              <div class="fb-avatar">${(f.userId?.fullName || '?').trim().charAt(0).toUpperCase()}</div>
              <div style="flex:1">
                <div class="name">${f.userId?.fullName || 'Cliente'}</div>
                <div class="text-xs muted">${formatDate(f.createdAt)}</div>
              </div>
              <div class="fb-avg" style="color:${scoreColor(f.average || 0)}">${(f.average ?? '-')}</div>
            </div>
            <div class="fb-breakdown">
              <div class="fb-line"><span>Experiência</span>${miniStars(f.experienceRating)}</div>
              <div class="fb-line"><span>Sabor</span>${miniStars(f.tasteRating)}</div>
              <div class="fb-line"><span>Atendimento</span>${miniStars(f.serviceRating)}</div>
            </div>
            ${f.comment ? `<p class="fb-comment">"${f.comment}"</p>` : ''}
            <button class="link-btn mt-1" style="color:var(--error)" onclick="deleteFeedback('${f._id}')">${icon('trash', 'icon icon-sm')} Excluir avaliação</button>
          </div>
        `).join('');
      } catch (e) { /* silencioso no painel */ }
    }

    window.deleteFeedback = async (id) => {
      if (!confirm('Excluir esta avaliação?')) return;
      try {
        await api.del('/api/admin/feedbacks/' + id);
        toast.show('Avaliação removida.');
        loadAdminFeedbacks();
      } catch (e) { toast.show(e.message, 'error'); }
    };

    function updateNav() {
      const nav = $('#bottom-nav');
      const adminBtn = $('#nav-admin');
      if (api.token) {
        nav.classList.remove('hidden');
        if (api.user?.role === 'admin') { adminBtn.classList.remove('hidden'); }
        else { adminBtn.classList.add('hidden'); }
      } else {
        nav.classList.add('hidden');
      }
    }

    // -- Notificações push reais (Web Push) --
    let swRegistration = null;

    function pushSupported() {
      return 'serviceWorker' in navigator && 'PushManager' in window;
    }

    async function registerServiceWorker() {
      if (!pushSupported()) return null;
      try {
        swRegistration = await navigator.serviceWorker.register('/sw.js');
        return swRegistration;
      } catch (e) {
        return null;
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
    }

    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    async function refreshPushUi() {
      const desc = $('#push-desc');
      const btn = $('#push-btn');
      if (!desc || !btn) return;

      if (!pushSupported()) {
        desc.textContent = 'Este navegador não suporta notificações. Tente pelo Chrome (Android) ou Safari (iPhone, após adicionar à tela de início).';
        btn.classList.add('hidden');
        return;
      }
      if (isIos && !isStandalone) {
        desc.textContent = 'No iPhone: toque em Compartilhar → "Adicionar à Tela de Início" e abra o app por lá para poder ativar as notificações.';
        btn.classList.add('hidden');
        return;
      }

      btn.classList.remove('hidden');
      const reg = swRegistration || (await registerServiceWorker());
      const sub = reg ? await reg.pushManager.getSubscription() : null;

      if (sub) {
        desc.textContent = 'Ativadas neste celular. Você vai receber os avisos da Pamonha Net mesmo com o app fechado.';
        btn.textContent = 'Desativar notificações';
        btn.classList.remove('btn-secondary'); btn.classList.add('btn-outline');
      } else {
        desc.textContent = 'Ative para receber avisos da Pamonha Net direto no seu celular, mesmo com o app fechado.';
        btn.textContent = 'Ativar notificações';
        btn.classList.remove('btn-outline'); btn.classList.add('btn-secondary');
      }
    }

    window.togglePush = async () => {
      const btn = $('#push-btn');
      const reg = swRegistration || (await registerServiceWorker());
      if (!reg) return toast.show('Não foi possível preparar as notificações neste navegador.', 'error');

      const existing = await reg.pushManager.getSubscription();
      if (existing) {
        try {
          await api.req('DELETE', '/api/client/push-subscribe', { endpoint: existing.endpoint });
          await existing.unsubscribe();
          toast.show('Notificações desativadas neste celular.');
        } catch (e) { toast.show('Erro ao desativar.', 'error'); }
        return refreshPushUi();
      }

      try {
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') {
          toast.show('Permissão de notificação negada.', 'error');
          return;
        }
        const { publicKey } = await api.get('/api/push/vapid-public-key');
        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicKey),
        });
        await api.post('/api/client/push-subscribe', {
          endpoint: sub.endpoint,
          keys: { p256dh: arrayBufferToBase64Url(sub.getKey('p256dh')), auth: arrayBufferToBase64Url(sub.getKey('auth')) },
          userAgent: navigator.userAgent,
        });
        toast.show('Notificações ativadas neste celular!');
      } catch (e) {
        toast.show('Não foi possível ativar. Tente novamente.', 'error');
      }
      refreshPushUi();
    };

    function arrayBufferToBase64Url(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      bytes.forEach((b) => { binary += String.fromCharCode(b); });
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function init() {
      updateNav();
      registerServiceWorker();

      const params = new URLSearchParams(location.search);
      const resetToken = params.get('reset');
      const scanToken = params.get('scan');

      if (api.token) {
        try {
          const data = await api.get('/api/auth/me');
          api.setAuth(api.token, data.user);
          updateNav();
        } catch (e) {
          api.clearAuth();
          updateNav();
        }
      }

      // Link de redefinição de senha (aberto pelo e-mail) tem prioridade sobre tudo.
      if (resetToken) {
        router.go('reset', true);
        return;
      }

      // QR Code lido por QUALQUER câmera (nativa do celular, WhatsApp, etc.) cai aqui:
      // se for um admin logado, processa o carimbo na hora, sem precisar abrir o scanner do app.
      if (scanToken) {
        history.replaceState(null, '', location.pathname);
        if (api.token && api.user?.role === 'admin') {
          await handleScanResult(scanToken);
          router.go('admin', true);
        } else if (!api.token) {
          toast.show('Entre como administrador para confirmar este carimbo.', 'error');
          router.go('login', true);
        } else {
          toast.show('Só administradores podem confirmar carimbos por QR Code.', 'error');
          router.go('card', true);
        }
        return;
      }

      if (!api.token) {
        router.go('login', true);
        return;
      }

      maybeShowSplash();
      router.render();
    }

    // -- Splash de abertura: o cartão aparece centralizado com os selos atuais, vira mostrando
    // uma mensagem no verso, volta, e some dando lugar à página já carregada. Só na primeira
    // sessão do dia (controlado por uma data salva no localStorage).
    const SPLASH_MESSAGES = [
      'Cada selo é um pedacinho de carinho.',
      'Obrigado por voltar sempre!',
      'Bom te ver por aqui de novo.',
    ];

    function shouldShowSplash() {
      const today = new Date().toISOString().slice(0, 10);
      const last = localStorage.getItem('pnf_splash_date');
      return last !== today;
    }

    async function maybeShowSplash() {
      if (!shouldShowSplash()) { router.render(); return; }
      localStorage.setItem('pnf_splash_date', new Date().toISOString().slice(0, 10));

      let stamps = 0;
      try {
        const data = await api.get('/api/client/dashboard');
        stamps = data.stamps || 0;
      } catch (e) { /* segue com 0 mesmo, splash não pode travar o app */ }

      const msg = SPLASH_MESSAGES[Math.floor(Math.random() * SPLASH_MESSAGES.length)];
      const overlay = document.createElement('div');
      overlay.className = 'splash-overlay';
      overlay.innerHTML = `
        <div class="splash-card-wrap">
          <div class="splash-card" id="splash-card">
            <div class="splash-face splash-front">
              <div class="ticket-label">${icon('kernel')} Cartão Pamonha Net</div>
              <div class="fidelity-grid">${Array.from({length:10}).map((_,i) => `
                <div class="stamp-slot ${i < stamps ? 'filled' : ''}">${i < stamps ? '<img src="/stamp.png" style="width:72%;height:72%;object-fit:contain">' : ''}</div>
              `).join('')}</div>
            </div>
            <div class="splash-face splash-back">
              <img src="/logo.png" alt="" style="width:56px;height:56px;border-radius:50%;margin-bottom:.7rem" />
              <p>${msg}</p>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      router.render();

      const card = $('#splash-card');
      await sleep(400);
      card.classList.add('is-flipped');
      await sleep(1300);
      card.classList.remove('is-flipped');
      await sleep(900);
      overlay.classList.add('splash-out');
      await sleep(500);
      overlay.remove();
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
