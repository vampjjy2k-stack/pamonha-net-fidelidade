          <div class="row-actions">
            <button class="icon-btn" onclick='toggleLocalActive(${JSON.stringify(l)})' title="${l.active ? 'Desativar' : 'Ativar'}">${icon(l.active ? 'minus' : 'plus', 'icon')}</button>
            <button class="icon-btn danger" onclick="deleteLocal('${l._id}')">${icon('trash','icon')}</button>
          </div>
        </div>
      `).join('');
    }

    window.createLocal = async () => {
      const name = $('#local-name').value.trim();
      const lat = Number($('#local-lat').value);
      const lng = Number($('#local-lng').value);
      const radiusMeters = Number($('#local-radius').value) || 150;
      if (!name) return toast.show('Informe o nome do local.', 'error');
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return toast.show('Toque no mapa ou use sua localização para definir o ponto.', 'error');
      try {
        await api.post('/api/admin/locais', { name, lat, lng, radiusMeters });
        toast.show('Local cadastrado.');
        $('#local-name').value = '';
        loadLocais();
      } catch (e) { toast.show(e.message, 'error'); }
    };

    window.toggleLocalActive = async (l) => {
      try { await api.put(`/api/admin/locais/${l._id}`, { active: !l.active }); loadLocais(); }
      catch (e) { toast.show(e.message, 'error'); }
    };

    window.deleteLocal = async (id) => {
      if (!confirm('Remover este local? O histórico de vendas antigas mantém o nome salvo.')) return;
      try { await api.del(`/api/admin/locais/${id}`); toast.show('Local removido.'); loadLocais(); }
      catch (e) { toast.show(e.message, 'error'); }
    };

    // ==========================================================================
    // VENDAS — histórico com liberdade de revisar: reatribuir local e apagar
    // vendas lançadas por engano (os selos dados por ela voltam automaticamente).
    // ==========================================================================
    let vendasCache = [];

    async function renderAdminVendas(container) {
      container.innerHTML = `
        <div class="surface section-gap">
          <h3 class="surface-title">${icon('cart','icon icon-sm')} Vendas recentes</h3>
          <p class="text-xs muted mb-1">Apagar uma venda com cliente desfaz os selos que ela deu. Vendas avulsas são apenas apagadas.</p>
        </div>
        <div id="vendas-list"><div class="loader"></div></div>
      `;
      loadVendas();
    }

    async function loadVendas() {
      try {
        const data = await api.get('/api/admin/vendas?limit=100');
        vendasCache = data.vendas;
        renderVendasList();
      } catch (e) { toast.show(e.message, 'error'); }
    }

    function renderVendasList() {
      const box = $('#vendas-list');
      if (!box) return;
      if (!vendasCache.length) { box.innerHTML = `<div class="empty-state"><p>Nenhuma venda registrada ainda.</p></div>`; return; }
      box.innerHTML = vendasCache.map(v => {
        const itemsLabel = v.items.map(it => `${it.quantity}× ${it.name}`).join(', ');
        const liquido = v.totalValue - (v.totalCost || 0);
        const isAvulsa = !v.clientId;
        const badge = v.localId
          ? `<span class="venda-badge ok">${icon('pin','icon icon-sm')} ${v.localName}</span>`
          : `<span class="venda-badge warn">${icon('map','icon icon-sm')} Local não identificado</span>`;
        return `
          <div class="venda-row">
            <div class="top">
              <div>
                <div class="client">${isAvulsa ? '🧾 Venda avulsa' : (v.clientId?.fullName || 'Cliente')}</div>
                <div class="meta">${formatDate(v.createdAt)}${isAvulsa ? '' : ` · ${v.stampsGiven} selo(s)${v.completedCardOnThisSale ? ' · fechou cartão 🎉' : ''}`}</div>
              </div>
              <div class="value">R$ ${v.totalValue.toFixed(2).replace('.', ',')}<span class="liquido">líquido R$ ${liquido.toFixed(2).replace('.', ',')}</span></div>
            </div>
            <div class="items">${itemsLabel}</div>
            ${badge}
            <div class="actions">
              ${!v.localId ? `<button class="btn btn-outline" onclick="openAssignLocal('${v._id}')">${icon('map','icon icon-sm')} Vincular local</button>` : ''}
              <button class="btn btn-outline" style="color:var(--danger);border-color:rgba(198,40,40,0.35)" onclick="deleteVenda('${v._id}')">${icon('trash','icon icon-sm')} Apagar</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.deleteVenda = async (id) => {
      if (!confirm('Apagar esta venda? Os selos que ela deu voltam para o cliente.')) return;
      try {
        await api.del('/api/admin/vendas/' + id);
        toast.show('Venda removida e selos revertidos.');
        loadVendas();
      } catch (e) { toast.show(e.message, 'error'); }
    };

    window.openAssignLocal = async (vendaId) => {
      if (!locaisCache.length) {
        try { const data = await api.get('/api/admin/locais'); locaisCache = data.locais; } catch (e) { /* segue com cache vazio */ }
      }
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'assign-local-overlay';
      overlay.innerHTML = `
        <div class="modal-card">
          <h3 class="surface-title">${icon('map','icon icon-sm')} Vincular local a esta venda</h3>
          ${locaisCache.length ? locaisCache.map(l => `
            <div class="cleanup-row">
              <div><strong>${l.name}</strong></div>
              <button class="btn btn-primary" onclick="confirmAssignLocal('${vendaId}', '${l._id}')">Usar</button>
            </div>
          `).join('') : `<p class="text-sm muted">Nenhum local cadastrado ainda.</p>`}
          <button class="btn btn-outline mt-1" onclick="closeModal()">Fechar</button>
        </div>
      `;
      document.body.appendChild(overlay);
    };

    window.confirmAssignLocal = async (vendaId, localId) => {
      try {
        await api.patch(`/api/admin/vendas/${vendaId}/local`, { localId });
        toast.show('Local vinculado à venda.');
        closeModal();
        loadVendas();
      } catch (e) { toast.show(e.message, 'error'); }
    };

    // ==========================================================================
    // HUB DE VENDAS — aberto pela lista de clientes, do hub de carimbo, ou como
    // "Nova venda" avulsa (sem cliente) a partir de Operação da loja.
    // Escolhe produtos + quantidade; cada unidade dá 1 selo (quando há cliente), e o
    // valor total entra nos gráficos (casado por GPS ou local escolhido manualmente).
    // ==========================================================================
    let salesCartClient = null;
    let salesCart = {};
    let salesAvulsa = false;
    let salesAvulsaLocalId = '';
    let salesAvulsaCoords = null;

    window.openSalesHub = async (client) => {
      salesCartClient = client;
      salesCart = {};
      salesAvulsa = !client;
      salesAvulsaLocalId = '';
      salesAvulsaCoords = null;
      if (!produtosCache.length) {
        try { const data = await api.get('/api/admin/produtos'); produtosCache = data.produtos; }
        catch (e) { toast.show(e.message, 'error'); return; }
      }
      if (!locaisCache.length) {
        try { const data = await api.get('/api/admin/locais'); locaisCache = data.locais; } catch (e) { /* segue sem locais */ }
      }
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'sales-hub-overlay';
      overlay.innerHTML = `
        <div class="modal-card" style="max-width:400px">
          <h3 class="surface-title" id="sales-hub-title"></h3>
          <div class="cleanup-row" style="padding-top:0">
            <div>
              <strong>Venda avulsa (sem cliente)</strong>
              <span>Venda sem cartão fidelidade — não dá selos, entra só nos gráficos.</span>
            </div>
            <label class="switch"><input type="checkbox" id="sales-avulsa-toggle" ${salesAvulsa ? 'checked' : ''} ${client ? '' : 'disabled'} onchange="toggleSalesAvulsa(this.checked)" /><span class="switch-track"></span></label>
          </div>
          <div id="sales-avulsa-local" class="hidden mb-1"></div>
          <div id="sales-cart-list">${salesCartListHTML()}</div>
          <div class="cart-total-bar">
            <span class="text-sm muted">Total</span>
            <strong id="sales-cart-total">R$ 0,00</strong>
          </div>
          <p class="text-xs muted text-center mt-1" id="sales-cart-stamps">0 selo(s) nesta venda</p>
          <div class="flex gap-1 mt-2">
            <button class="btn btn-outline" style="flex:1" onclick="closeSalesHub()">Cancelar</button>
            <button class="btn btn-qr-green" style="flex:1" id="sales-hub-confirm-btn" onclick="confirmSalesHub()">${icon('check','icon icon-sm')} Confirmar venda</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      renderSalesHubHead();
    };

    function renderSalesHubHead() {
      const title = $('#sales-hub-title');
      if (title) title.innerHTML = salesAvulsa
        ? `${icon('cart','icon icon-sm')} Venda avulsa`
        : `${icon('cart','icon icon-sm')} Venda para ${salesCartClient.fullName.split(' ')[0]}`;
      const btn = $('#sales-hub-confirm-btn');
      if (btn) btn.innerHTML = `${icon('check','icon icon-sm')} ${salesAvulsa ? 'Registrar venda avulsa' : 'Confirmar venda'}`;
      const localBox = $('#sales-avulsa-local');
      if (localBox) {
        localBox.classList.toggle('hidden', !salesAvulsa);
        if (salesAvulsa) {
          localBox.innerHTML = `
            <label class="label">Local da venda</label>
            <select class="input mb-1" id="sales-avulsa-local-select" onchange="salesAvulsaLocalId = this.value">
              <option value="">Selecione um local cadastrado…</option>
              ${locaisCache.filter(l => l.active).map(l => `<option value="${l._id}" ${salesAvulsaLocalId === l._id ? 'selected' : ''}>${l.name}</option>`).join('')}
            </select>
            <button class="btn btn-outline" onclick="useMyLocationForSalesAvulsa()">${icon('pin','icon icon-sm')} Usar GPS</button>
            ${salesAvulsaCoords ? `<p class="text-xs muted mt-1">${icon('check','icon icon-sm')} Localização GPS capturada.</p>` : ''}
          `;
        }
      }
    }

    window.toggleSalesAvulsa = (checked) => { salesAvulsa = checked; renderSalesHubHead(); };

    window.useMyLocationForSalesAvulsa = () => {
      if (!navigator.geolocation) return toast.show('Este dispositivo não tem GPS disponível.', 'error');
      toast.show('Buscando sua localização…');
      navigator.geolocation.getCurrentPosition(
        (pos) => { salesAvulsaCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude }; toast.show('Localização capturada.'); renderSalesHubHead(); },
        () => toast.show('Não foi possível obter sua localização.', 'error'),
        { enableHighAccuracy: true, timeout: 8000 }
      );
    };

    function salesCartListHTML() {
      const activeProdutos = produtosCache.filter(p => p.active);
      if (!activeProdutos.length) return `<p class="text-sm muted text-center">Nenhum produto ativo cadastrado. Cadastre em Produtos.</p>`;
      return activeProdutos.map(p => `
        <div class="cart-row">
          <div class="info"><strong>${p.name}</strong><span>R$ ${p.price.toFixed(2).replace('.', ',')}</span></div>
          <div class="qty-stepper">
            <button onclick="changeCartQty('${p._id}', -1)">${icon('minus','icon')}</button>
            <span class="qty-val" id="cart-qty-${p._id}">${salesCart[p._id] || 0}</span>
            <button onclick="changeCartQty('${p._id}', 1)">${icon('plus','icon')}</button>
          </div>
        </div>
      `).join('');
    }

    window.changeCartQty = (produtoId, delta) => {
      const current = salesCart[produtoId] || 0;
      const next = Math.max(0, current + delta);
      if (next === 0) delete salesCart[produtoId]; else salesCart[produtoId] = next;
      const el = $('#cart-qty-' + produtoId);
      if (el) el.textContent = next;
      updateSalesCartTotals();
    };

    function updateSalesCartTotals() {
      let total = 0, stamps = 0;
      for (const [id, qty] of Object.entries(salesCart)) {
        const p = produtosCache.find(pp => pp._id === id);
        if (!p) continue;
        total += p.price * qty;
        stamps += qty;
      }
      const totalEl = $('#sales-cart-total'); if (totalEl) totalEl.textContent = 'R$ ' + total.toFixed(2).replace('.', ',');
      const stampsEl = $('#sales-cart-stamps');
      if (stampsEl) stampsEl.textContent = salesAvulsa ? 'Venda avulsa — não dá selos' : `${stamps} selo${stamps === 1 ? '' : 's'} nesta venda`;
    }

    window.closeSalesHub = () => {
      const el = $('#sales-hub-overlay'); if (el) el.remove();
      salesCartClient = null; salesCart = {}; salesAvulsa = false; salesAvulsaLocalId = ''; salesAvulsaCoords = null;
    };

    window.confirmSalesHub = async () => {
      const items = Object.entries(salesCart).map(([produtoId, quantity]) => ({ produtoId, quantity }));
      if (!items.length) return toast.show('Escolha ao menos 1 produto.', 'error');
      if (salesAvulsa && !salesAvulsaLocalId && !salesAvulsaCoords) {
        return toast.show('Venda avulsa precisa de um local cadastrado ou do GPS.', 'error');
      }

      let coords = salesAvulsa ? salesAvulsaCoords : null;
      if (!salesAvulsa && navigator.geolocation) {
        coords = await new Promise((resolve) => {
          navigator.geolocation.getCurrentPosition(
            (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
            () => resolve(null),
            { enableHighAccuracy: true, timeout: 6000 }
          );
        });
      }

      try {
        const body = { items };
        if (salesAvulsa) {
          body.clientId = null;
          if (salesAvulsaLocalId) body.localId = salesAvulsaLocalId;
          else if (coords) { body.lat = coords.lat; body.lng = coords.lng; }
        } else {
          body.clientId = salesCartClient._id;
          if (coords) { body.lat = coords.lat; body.lng = coords.lng; }
        }
        const data = await api.post('/api/admin/vendas', body);
        const overflowMsg = data.overflowStamps > 0 ? ` (${data.overflowStamps} selo(s) não contaram — cartão já estava cheio)` : '';
        const msg = salesAvulsa ? 'Venda avulsa registrada.' : `Venda registrada: ${data.venda?.stampsGiven ?? 0} selo(s).${overflowMsg}`;
        toast.show(msg);
        closeSalesHub();
        loadAdminClients();
        if (data.needsLocation) openLocationPicker(data.nearestLocais, coords, data.venda._id);
      } catch (e) { toast.show(e.message, 'error'); }
    };

    function openLocationPicker(nearest, coords, vendaId) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'location-picker-overlay';
      const nearestHTML = nearest && nearest.length
        ? `<p class="text-xs muted mb-1">Locais cadastrados mais próximos — toque para usar um deles:</p>` + nearest.map(n => `
            <div class="cleanup-row">
              <div><strong>${n.name}</strong><span>${Math.round(n.distanceMeters)}m de distância</span></div>
              <button class="btn btn-primary" onclick='confirmAssignLocal("${vendaId}", "${n.localId}"); closeLocationPicker()'>Usar</button>
            </div>
          `).join('')
        : `<p class="text-xs muted mb-1">Nenhum local cadastrado perto daqui.</p>`;
      overlay.innerHTML = `
        <div class="modal-card">
          <h3 class="surface-title">${icon('map','icon icon-sm')} Local não identificado</h3>
          <p class="text-sm mb-1">Esta venda ficou sem local vinculado — está fora do raio de todos os locais cadastrados. Ela conta normalmente nos selos e no faturamento total, só não aparece nos gráficos por local até você vincular um.</p>
          ${nearestHTML}
          <div class="flex gap-1 mt-2">
            <button class="btn btn-outline" style="flex:1" onclick="closeLocationPicker()">Deixar sem local</button>
            ${coords ? `<button class="btn btn-primary" style="flex:1" onclick='closeLocationPicker(); goRegisterLocal(${coords.lat}, ${coords.lng})'>${icon('plus','icon icon-sm')} Cadastrar local aqui</button>` : ''}
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }
    window.closeLocationPicker = () => { const el = $('#location-picker-overlay'); if (el) el.remove(); };
    window.goRegisterLocal = (lat, lng) => {
      router.go('admin', true);
      adminActiveTab = 'locais';
      renderAdminTabBody();
      setTimeout(() => {
        setLocalLatLng(lat, lng);
        if (localMapInstance && localMapMarker) {
          localMapInstance.setView([lat, lng], 16);
          localMapMarker.setLatLng([lat, lng]);
          localMapCircle.setLatLng([lat, lng]);
        }
      }, 80);
    };

    // ==========================================================================
    // GRÁFICOS & RELATÓRIOS — cascata (waterfall) ano→mês→semana, pizza de
    // satisfação, cartões fechados por local, faturamento por local e limpeza.
    // ==========================================================================
    let graficosAno = null;
    let graficosMes = null; // null = nível ano; 1-12 = nível mês (mostra semanas)
    let waterfallChart = null;
    let pizzaChart = null;

    window.setGraficosAno = (ano) => { graficosAno = Number(ano); graficosMes = null; renderAdminGraficos($('#admin-sub') || $('#admin-tab-body')); };
    window.drillGraficosMes = (mesIndex) => { graficosMes = mesIndex; renderAdminGraficos($('#admin-sub') || $('#admin-tab-body')); };
    window.voltarGraficosAno = () => { graficosMes = null; renderAdminGraficos($('#admin-sub') || $('#admin-tab-body')); };

    const MESES_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const MESES_PT_LONG = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    async function renderAdminGraficos(container) {
      if (!container) return;
      container.innerHTML = `<div class="loader"></div>`;
      try {
        const anosData = await api.get('/api/admin/graficos/anos');
        const anos = anosData.anos || [];
        if (!anos.length) {
          container.innerHTML = `<div class="empty-state">${icon('chart','icon')}<p>Nenhuma venda ainda.</p></div>
            <div class="surface section-gap mt-2">
              <h3 class="surface-title" style="color:var(--danger)">${icon('broom','icon icon-sm')} Limpar dados</h3>
              <button class="btn btn-outline" onclick="setAdminTab('limpeza')">${icon('broom','icon icon-sm')} Abrir limpeza de dados</button>
            </div>`;
          return;
        }
        if (graficosAno === null || !anos.includes(graficosAno)) graficosAno = anos[0];

        const fatQuery = `ano=${graficosAno}` + (graficosMes ? `&mes=${graficosMes}` : '');
        const [fatData, sat, cartoesData, fatLocalData] = await Promise.all([
          api.get(`/api/admin/graficos/faturamento?${fatQuery}`),
          api.get('/api/admin/graficos/satisfacao'),
          api.get(`/api/admin/graficos/cartoes-por-local?${fatQuery}`),
          api.get(`/api/admin/graficos/faturamento-por-local?${fatQuery}`),
        ]);
        drawGraficos(container, anos, fatData, sat, cartoesData, fatLocalData);
      } catch (e) {
        container.innerHTML = `<div class="empty-state"><p>${e.message}</p></div>`;
      }
    }

    function escapeXML(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function fmtMoney(v) { return (v || 0).toFixed(2).replace('.', ','); }
    function fmtMoneyFull(v) { return 'R$ ' + fmtMoney(v); }

    function svgHBarChart(data, opts) {
      const { valueFmt = (v) => String(v), color = 'var(--husk-700)' } = opts || {};
      const width = 320, rowH = 30, gap = 12, labelW = 100;
      const barAreaW = width - labelW - 54;
      const max = Math.max(1, ...data.map((d) => d.value));
      const height = data.length * (rowH + gap) - gap + 6;
      const rows = data.map((d, i) => {
        const y = i * (rowH + gap);
        const barW = Math.max(3, (d.value / max) * barAreaW);
        return `
          <text x="${labelW - 8}" y="${y + rowH / 2 + 4}" text-anchor="end" font-size="10.5" fill="var(--ink)" font-family="var(--font-body)">${escapeXML(d.label)}</text>
          <rect x="${labelW}" y="${y + 3}" width="${barAreaW}" height="${rowH - 6}" rx="${(rowH - 6) / 2}" fill="var(--husk-300)" />
          <rect x="${labelW}" y="${y + 3}" width="${barW}" height="${rowH - 6}" rx="${(rowH - 6) / 2}" fill="${color}" />
          <text x="${labelW + barAreaW + 8}" y="${y + rowH / 2 + 4}" font-size="10.5" font-weight="700" fill="var(--amber-dark)" font-family="var(--font-body)">${valueFmt(d.value)}</text>
        `;
      }).join('');
      return `<svg class="bar-chart-svg" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">${rows}</svg>`;
    }

    function svgGroupedBarChart(data) {
      const width = 320, rowH = 46, gap = 14, labelW = 100, subH = 13, subGap = 4;
      const barAreaW = width - labelW - 62;
      const max = Math.max(1, ...data.flatMap((d) => [d.bruto, d.liquido]));
      const height = data.length * (rowH + gap) - gap + 6;
      const rows = data.map((d, i) => {
        const y = i * (rowH + gap);
        const wBruto = Math.max(3, (d.bruto / max) * barAreaW);
        const wLiquido = Math.max(3, (d.liquido / max) * barAreaW);
        return `
          <text x="${labelW - 8}" y="${y + rowH / 2 + 4}" text-anchor="end" font-size="10.5" fill="var(--ink)" font-family="var(--font-body)">${escapeXML(d.label)}</text>
          <rect x="${labelW}" y="${y + 2}" width="${barAreaW}" height="${subH}" rx="6.5" fill="var(--husk-300)" />
          <rect x="${labelW}" y="${y + 2}" width="${wBruto}" height="${subH}" rx="6.5" fill="var(--green)" />
          <text x="${labelW + barAreaW + 8}" y="${y + 2 + subH - 2}" font-size="9.5" font-weight="700" fill="var(--green-dark)" font-family="var(--font-body)">R$ ${fmtMoney(d.bruto)}</text>
          <rect x="${labelW}" y="${y + 2 + subH + subGap}" width="${barAreaW}" height="${subH}" rx="6.5" fill="var(--amber-soft)" />
          <rect x="${labelW}" y="${y + 2 + subH + subGap}" width="${wLiquido}" height="${subH}" rx="6.5" fill="var(--amber)" />
          <text x="${labelW + barAreaW + 8}" y="${y + 2 + subH + subGap + subH - 2}" font-size="9.5" font-weight="700" fill="var(--amber-dark)" font-family="var(--font-body)">R$ ${fmtMoney(d.liquido)}</text>
        `;
      }).join('');
      return `<svg class="bar-chart-svg" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">${rows}</svg>`;
    }

    function drawGraficos(container, anos, fatData, sat, cartoesData, fatLocalData) {
      const totais = fatData.totais || { bruto: 0, custo: 0, liquido: 0, vendas: 0, cartoesFechados: 0 };
      const medias = fatData.medias || {};
      const posicoes = fatData.posicoes || fatData.data || [];
      const isMesView = !!graficosMes;

      const breadcrumb = isMesView
        ? `<button class="breadcrumb-back" onclick="voltarGraficosAno()">${icon('logout','icon icon-sm')}</button><span>${graficosAno} ▸ ${MESES_PT_LONG[graficosMes - 1]}</span>`
        : `<span>${graficosAno}</span>`;

      const cartoesBody = (cartoesData.porLocal || []).length
        ? svgHBarChart(cartoesData.porLocal.map((r) => ({ label: r.local, value: r.cartoesFechados })), { valueFmt: (v) => String(v), color: 'var(--green)' })
        : `<p class="text-sm muted">Nenhum cartão fechado neste período.</p>`;

      const fatLocalBody = (fatLocalData.porLocal || []).length
        ? svgGroupedBarChart(fatLocalData.porLocal.map((r) => ({ label: r.local, bruto: r.faturamentoBruto ?? r.bruto, liquido: r.faturamentoLiquido ?? r.liquido })))
        : `<p class="text-sm muted">Nenhuma venda neste período.</p>`;

      container.innerHTML = `
        <div class="surface section-gap">
          <div class="chart-head">
            <select class="input" id="graficos-ano-select" style="width:auto" onchange="setGraficosAno(this.value)">
              ${anos.map(a => `<option value="${a}" ${a === graficosAno ? 'selected' : ''}>${a}</option>`).join('')}
            </select>
          </div>
          <div class="stat-grid mt-1">
            <div class="stat-box"><div class="num">R$ ${fmtMoney(totais.bruto)}</div><div class="lbl">Bruto</div></div>
            <div class="stat-box"><div class="num" style="color:var(--danger)">R$ ${fmtMoney(totais.custo)}</div><div class="lbl">Custo</div></div>
            <div class="stat-box"><div class="num" style="color:var(--amber-dark)">R$ ${fmtMoney(totais.liquido)}</div><div class="lbl">Líquido</div></div>
          </div>
          <div class="stat-grid">
            <div class="stat-box"><div class="num">${totais.vendas || 0}</div><div class="lbl">Vendas</div></div>
            <div class="stat-box"><div class="num">${totais.cartoesFechados || 0}</div><div class="lbl">Cartões fechados</div></div>
            <div class="stat-box"><div class="num">R$ ${fmtMoney(isMesView ? (medias.porSemana ?? medias.media) : (medias.porMes ?? medias.media))}</div><div class="lbl">${isMesView ? 'Média/semana' : 'Média/mês'}</div></div>
          </div>

          <div class="chart-head">
            <h3 class="surface-title">${icon('chart','icon icon-sm')} Faturamento</h3>
            <div class="breadcrumb">${breadcrumb}</div>
          </div>
          <div class="waterfall-wrap"><canvas id="waterfall-canvas" height="220"></canvas></div>
          <p class="text-xs muted text-center mt-1">${isMesView ? 'Semanas do mês — toque em uma barra para ver detalhes no tooltip.' : 'Toque em um mês para abrir as semanas.'}</p>
        </div>

        <div class="surface section-gap">
          <h3 class="surface-title">${icon('star','icon icon-sm')} Avaliações</h3>
          ${!sat.totalAvaliacoes ? `<p class="text-sm muted">Nenhuma avaliação ainda.</p>` : `
            <div class="pizza-wrap">
              <div style="position:relative;flex-shrink:0"><canvas id="pizza-canvas" width="140" height="140"></canvas>
                <div class="pizza-center"><strong>${sat.percentualSatisfeitos ?? 0}%</strong><span>satisfeitos</span></div>
              </div>
              <div class="chart-legend" id="pizza-legend"></div>
            </div>
            <div class="mt-2" id="avaliacoes-recentes">
              ${(sat.avaliacoesRecentes || []).slice(0, 8).map(a => `
                <div class="fb-card">
                  <div class="fb-card-head">
                    <div class="fb-avatar">${(a.nome || a.userId?.fullName || '?').trim().charAt(0).toUpperCase()}</div>
                    <div style="flex:1"><div class="name">${a.nome || a.userId?.fullName || 'Cliente'}</div><div class="text-xs muted">${formatDate(a.createdAt)}</div></div>
                    ${rateMiniHTML(a.nota ?? a.average ?? 0)}
                  </div>
                  ${a.comment ? `<p class="fb-comment">"${a.comment}"</p>` : ''}
                  <button class="link-btn mt-1" style="color:var(--danger)" onclick="deleteFeedback('${a._id}')">${icon('trash', 'icon icon-sm')} Excluir avaliação</button>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <div class="surface section-gap">
          <h3 class="surface-title">${icon('trophy','icon icon-sm')} Cartões fechados por local</h3>
          ${cartoesBody}
        </div>

        <div class="surface section-gap">
          <h3 class="surface-title">${icon('chart','icon icon-sm')} Faturamento por local</h3>
          ${(fatLocalData.porLocal || []).length ? `
            <div class="chart-legend-row">
              <div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span>Bruto</div>
              <div class="legend-item"><span class="legend-dot" style="background:var(--amber)"></span>Líquido</div>
            </div>
          ` : ''}
          ${fatLocalBody}
        </div>

        <div class="surface section-gap" style="border-color:rgba(198,40,40,0.35)">
          <h3 class="surface-title" style="color:var(--danger)">${icon('broom','icon icon-sm')} Limpar dados</h3>
          <p class="text-xs muted mb-1">Apagar vendas, avaliações ou zerar cartões — com confirmação.</p>
          <button class="btn btn-danger" onclick="setAdminTab('limpeza')">${icon('broom','icon icon-sm')} Abrir limpeza de dados</button>
        </div>
      `;

      drawWaterfallChart(posicoes);
      if (sat.totalAvaliacoes) drawPizzaChart(sat);
    }

    // -- Gráfico cascata (waterfall): 3 barras flutuantes por posição — Bruto, Custo, Líquido --
    function drawWaterfallChart(posicoes) {
      const canvas = $('#waterfall-canvas');
      if (!canvas || typeof Chart === 'undefined') return;
      if (waterfallChart) { waterfallChart.destroy(); waterfallChart = null; }
      const labels = posicoes.map(p => p.label);
      const brutoData = posicoes.map(p => [0, p.bruto]);
      const custoData = posicoes.map(p => [Math.max(0, p.bruto - p.custo), p.bruto]);
      const liquidoData = posicoes.map(p => [0, p.liquido]);
      waterfallChart = new Chart(canvas, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'Bruto', data: brutoData, backgroundColor: 'rgba(46,125,50,0.28)', borderRadius: 4, barPercentage: 0.9, categoryPercentage: 0.85 },
            { label: 'Custo', data: custoData, backgroundColor: '#C62828', borderRadius: 4, barPercentage: 0.5, categoryPercentage: 0.85 },
            { label: 'Líquido', data: liquidoData, backgroundColor: '#F9A825', borderRadius: 4, barPercentage: 0.32, categoryPercentage: 0.85 },
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          onClick: (evt, elements) => {
            if (graficosMes) return;
            if (elements.length) {
              const idx = elements[0].index;
              const p = posicoes[idx];
              if (p && p.vendas) drillGraficosMes(idx + 1);
            }
          },
          plugins: {
            legend: { position: 'bottom', labels: { font: { size: 11 }, boxWidth: 12 } },
            tooltip: {
              callbacks: {
                title: (items) => posicoes[items[0].dataIndex]?.label || '',
                label: (item) => {
                  const p = posicoes[item.dataIndex];
                  if (!p) return '';
                  if (item.datasetIndex === 0) return `Bruto: ${fmtMoneyFull(p.bruto)}`;
                  if (item.datasetIndex === 1) return `Custo: ${fmtMoneyFull(p.custo)}`;
                  return `Líquido: ${fmtMoneyFull(p.liquido)} · ${p.vendas || 0} vendas${p.cartoesFechados ? ' · ' + p.cartoesFechados + ' cartões' : ''}`;
                }
              }
            }
          },
          scales: {
            x: { grid: { display: false } },
            y: { beginAtZero: true, ticks: { callback: (v) => 'R$' + v } }
          }
        }
      });
    }

    // -- Pizza de satisfação: sempre 5 fatias (notas 1 a 5), degradê âmbar→verde --
    function drawPizzaChart(sat) {
      const canvas = $('#pizza-canvas');
      if (!canvas || typeof Chart === 'undefined') return;
      if (pizzaChart) { pizzaChart.destroy(); pizzaChart = null; }
      const dist = [1,2,3,4,5].map(n => {
        const found = (sat.distribuicaoPorNota || []).find(d => d.nota === n);
        return found ? found.quantidade : 0;
      });
      const colors = ['#E65100', '#F9A825', '#FDD835', '#7CB342', '#2E7D32'];
      pizzaChart = new Chart(canvas, {
        type: 'pie',
        data: { labels: ['1 estrela','2 estrelas','3 estrelas','4 estrelas','5 estrelas'], datasets: [{ data: dist, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
        options: { responsive: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (item) => `${item.label}: ${item.raw}` } } } }
      });
      const legend = $('#pizza-legend');
      if (legend) {
        legend.innerHTML = ['1','2','3','4','5'].map((n, i) => `
          <div class="legend-item"><span class="legend-dot" style="background:${colors[i]}"></span>${n} estrela${n==='1'?'':'s'}<strong>${dist[i]}</strong></div>
        `).join('');
      }
    }

    // ==========================================================================
    // LIMPAR DADOS — apagar vendas/avaliações selecionadas, zerar cartões, ou
    // apagar tudo (zona vermelha, exige digitar "APAGAR TUDO").
    // ==========================================================================
    async function renderLimpeza(container) {
      container.innerHTML = `<div class="loader"></div>`;
      try {
        if (!vendasCache.length) { const v = await api.get('/api/admin/vendas?limit=100'); vendasCache = v.vendas; }
        if (!adminFeedbacksCache.length) { const f = await api.get('/api/admin/feedbacks'); adminFeedbacksCache = f.feedbacks; }
      } catch (e) { /* segue com o que tiver em cache */ }

      container.innerHTML = `
        <div class="surface section-gap">
          <h3 class="surface-title">${icon('box','icon icon-sm')} Apagar vendas selecionadas</h3>
          <div class="limpeza-list">
            ${vendasCache.slice(0, 30).map(v => `
              <label class="limpeza-item"><input type="checkbox" class="limpeza-venda-chk" value="${v._id}" />
                <span>${v.clientId?.fullName || 'Venda avulsa'} · R$ ${v.totalValue.toFixed(2).replace('.', ',')} · ${formatDateShort(v.createdAt)}</span>
              </label>
            `).join('') || '<p class="text-sm muted">Nenhuma venda.</p>'}
          </div>
          <button class="btn btn-danger mt-1" onclick="limparEscopo('vendas')">${icon('trash','icon icon-sm')} Apagar selecionadas</button>
        </div>

        <div class="surface section-gap">
          <h3 class="surface-title">${icon('star','icon icon-sm')} Apagar avaliações selecionadas</h3>
          <div class="limpeza-list">
            ${adminFeedbacksCache.slice(0, 30).map(f => `
              <label class="limpeza-item"><input type="checkbox" class="limpeza-avaliacao-chk" value="${f._id}" />
                <span>${f.userId?.fullName || 'Cliente'} · média ${f.average ?? '-'} · ${formatDateShort(f.createdAt)}</span>
              </label>
            `).join('') || '<p class="text-sm muted">Nenhuma avaliação.</p>'}
          </div>
          <button class="btn btn-danger mt-1" onclick="limparEscopo('avaliacoes')">${icon('trash','icon icon-sm')} Apagar selecionadas</button>
        </div>

        <div class="surface section-gap">
          <h3 class="surface-title">${icon('broom','icon icon-sm')} Período visualizado</h3>
          <p class="text-xs muted mb-1">Apaga vendas e avaliações de ${graficosMes ? MESES_PT_LONG[graficosMes-1] + '/' : ''}${graficosAno || 'todo o período'}.</p>
          <button class="btn btn-danger" onclick="limparEscopo('periodo')">Apagar dados do período visualizado</button>
        </div>

        <div class="surface section-gap">
          <h3 class="surface-title">${icon('reset','icon icon-sm')} Cartões</h3>
          <button class="btn btn-danger" onclick="limparEscopo('cartoes')">Zerar contagem de cartões</button>
        </div>

        <div class="surface" style="border-color:rgba(198,40,40,0.5);background:rgba(198,40,40,0.05)">
          <h3 class="surface-title" style="color:var(--danger)">${icon('trash','icon icon-sm')} Zona vermelha</h3>
          <p class="text-sm mb-1">Apaga <strong>todos</strong> os dados: vendas, avaliações, produtos, locais e contagem de cartões. Não pode ser desfeito.</p>
          <label class="label">Digite APAGAR TUDO para confirmar</label>
          <input class="input mb-1" id="limpeza-confirm-word" placeholder="APAGAR TUDO" />
          <button class="btn btn-danger" onclick="limparEscopo('tudo')">Apagar TUDO</button>
        </div>
      `;
    }

    window.limparEscopo = async (escopo) => {
      const body = { escopo };
      if (escopo === 'vendas') {
        body.vendaIds = $$('.limpeza-venda-chk:checked').map(el => el.value);
        if (!body.vendaIds.length) return toast.show('Selecione ao menos uma venda.', 'error');
      } else if (escopo === 'avaliacoes') {
        body.avaliacaoIds = $$('.limpeza-avaliacao-chk:checked').map(el => el.value);
        if (!body.avaliacaoIds.length) return toast.show('Selecione ao menos uma avaliação.', 'error');
      } else if (escopo === 'periodo') {
        body.ano = graficosAno; if (graficosMes) body.mes = graficosMes;
      } else if (escopo === 'tudo') {
        const word = $('#limpeza-confirm-word').value.trim();
        if (word !== 'APAGAR TUDO') return toast.show('Digite APAGAR TUDO para confirmar.', 'error');
        body.confirmCode = word;
      }
      if (!confirm('Tem certeza? Esta ação não pode ser desfeita.')) return;
      try {
        const data = await api.post('/api/admin/limpeza', body);
        toast.show(`Removido(s): ${data.removidos ?? 'concluído'}.`);
        vendasCache = []; adminFeedbacksCache = [];
        renderLimpeza($('#admin-sub') || $('#admin-tab-body'));
      } catch (e) { toast.show(e.message, 'error'); }
    };

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
