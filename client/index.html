      catch (e) { carroAdminAviso = null; toast.show(e.message, 'error'); }
      renderCarroAdminLive();
      renderCarroAdminAviso();
    }
    let carroAdminAviso = null;

    function renderCarroAdminLive() {
      const box = $('#carro-admin-main');
      if (!box) return;
      const s = carroState, live = !!(s && s.live);
      const editing = document.activeElement && (document.activeElement.id === 'carro-place-input' || document.activeElement.id === 'carro-place-edit');
      if (editing) return;
      if (!live) {
        box.innerHTML = `
          <h3 class="surface-title">🚗 Carro da Pamonha</h3>
          <p class="text-sm muted mb-1">Ao entrar no carro, o GPS deste celular é compartilhado com todos os clientes e o botão <strong>Acompanhar</strong> aparece no app deles.</p>
          <label class="label">Nome do lugar (opcional)</label>
          <input class="input mb-1" id="carro-place-input" maxlength="80" placeholder="Deixe vazio: o site descobre sozinho" />
          <button class="carro-big-btn on" id="carro-toggle" onclick="carroEntrar()">🚗 Entrar no carro</button>
          <p class="text-xs muted mt-1">Dica: o nome sai automático da feira cadastrada em <strong>Locais</strong> ou, fora delas, da rua/bairro.</p>
        `;
        return;
      }
      const age = carroAgeSec();
      const transmitindo = carroTx.active;
      box.innerHTML = `
        <h3 class="surface-title">🚗 Carro da Pamonha <span class="carro-badge" style="margin-left:auto">no ar</span></h3>
        ${transmitindo ? '' : `<div class="carro-chip warn" style="display:block;margin-bottom:0.7rem;border-radius:12px;padding:0.6rem 0.8rem">Este celular não está transmitindo (a página foi recarregada). Toque em <strong>Retomar</strong> para voltar a enviar o GPS.</div>`}
        ${carroTx.error ? `<div class="carro-chip warn" style="display:block;margin-bottom:0.7rem;border-radius:12px;padding:0.6rem 0.8rem">${esc(carroTx.error)}</div>` : ''}
        <dl class="carro-kv">
          <dt>Lugar</dt><dd>${esc(s.place?.name || 'identificando…')}${s.place?.source === 'manual' ? ' <span class="muted">(manual)</span>' : ''}</dd>
          <dt>Última posição</dt><dd>${agoText(age)}</dd>
          <dt>Precisão</dt><dd>${s.position?.accuracy !== null && s.position?.accuracy !== undefined ? '±' + s.position.accuracy + ' m' : '—'}</dd>
          <dt>Enviadas</dt><dd>${carroTx.sentCount}</dd>
        </dl>
        <label class="label">Corrigir nome do lugar</label>
        <div class="flex gap-1 mb-1">
          <input class="input" id="carro-place-edit" maxlength="80" placeholder="Ex: Feira da Figueira — banca 12" value="${esc(s.place?.source === 'manual' ? s.place.name : '')}" />
          <button class="btn btn-outline" style="width:auto" onclick="carroSalvarLugar()">Salvar</button>
        </div>
        ${transmitindo ? '' : `<button class="btn btn-success mb-1" onclick="carroRetomar()">Retomar transmissão</button>`}
        <button class="carro-big-btn off" id="carro-toggle" onclick="carroSaiDoCarro()">Sair do carro</button>
        <p class="text-xs muted mt-1">Mantenha o app aberto e a tela ligada enquanto estiver no carro — o celular só envia o GPS com o app aberto.</p>
      `;
    }
    setInterval(() => { if ($('#carro-admin-main') && carroState?.live) renderCarroAdminLive(); }, 5000);

    // Aviso do carro — simplificado: Publicar agora / Planejar início / Terminar agora / Planejar término
    function renderCarroAdminAviso() {
      const box = $('#carro-admin-aviso');
      if (!box) return;
      const a = carroAdminAviso;
      const status = a ? a.status : null;

      let statusBar = '';
      if (status === 'ativo') {
        statusBar = '<div class="aviso-status-bar ativo">● No ar agora' + (a.hideAt ? ' · termina ' + fmtDiaHora(a.hideAt) : '') + '</div>';
      } else if (status === 'agendado') {
        statusBar = '<div class="aviso-status-bar agendado">◐ Agendado · começa ' + fmtDiaHora(a.showAt) + (a.hideAt ? ' · termina ' + fmtDiaHora(a.hideAt) : '') + '</div>';
      } else if (status === 'encerrado') {
        statusBar = '<div class="aviso-status-bar encerrado">○ Encerrado' + (a.hideAt ? ' em ' + fmtDiaHora(a.hideAt) : '') + '</div>';
      }

      let actionsHTML = '';
      if (status === 'ativo') {
        actionsHTML =
          '<div class="flex gap-1 mb-1">' +
            '<button class="btn btn-secondary" style="flex:1" onclick="carroAvisoTerminarAgora()">Terminar agora</button>' +
            '<button class="btn btn-outline" style="flex:1" onclick="toggleAvisoPlanejar(\'hide\')">Planejar término</button>' +
          '</div>';
      } else if (status === 'agendado') {
        actionsHTML =
          '<div class="flex gap-1 mb-1">' +
            '<button class="btn btn-primary" style="flex:1" onclick="carroAvisoPublicarAgora()">Publicar agora</button>' +
            '<button class="btn btn-outline" style="flex:1" onclick="carroRemoverAviso()">Cancelar agendamento</button>' +
          '</div>';
      } else {
        actionsHTML =
          '<div class="flex gap-1 mb-1">' +
            '<button class="btn btn-primary" style="flex:1" onclick="carroAvisoPublicarAgora()">Publicar agora</button>' +
            '<button class="btn btn-outline" style="flex:1" onclick="toggleAvisoPlanejar(\'show\')">Planejar início</button>' +
          '</div>';
      }

      box.innerHTML =
        '<h3 class="surface-title">' + icon('bell', 'icon icon-sm') + ' Aviso do carro</h3>' +
        '<p class="text-sm muted mb-1">Avise quando o carro estará na rua. O aviso aparece na tela dos clientes e some sozinho no horário que você escolher.</p>' +
        statusBar +
        '<label class="label">Mensagem</label>' +
        '<textarea class="input mb-1" id="aviso-msg" rows="2" maxlength="200" placeholder="Ex: Sábado o carro estará na Feira da Figueira">' + esc(a ? a.message : '') + '</textarea>' +
        '<label class="label">Onde (opcional)</label>' +
        '<input class="input mb-1" id="aviso-place" maxlength="80" placeholder="Ex: Feira da Figueira" value="' + esc(a ? (a.place || '') : '') + '" />' +
        '<div id="aviso-planejar" class="hidden"><div class="aviso-planejar-box">' +
          '<label class="label" id="aviso-planejar-label">Quando?</label>' +
          '<input class="input mb-1" type="datetime-local" id="aviso-datetime" />' +
          '<div class="flex gap-1">' +
            '<button class="btn btn-outline" style="flex:1" onclick="cancelarPlanejar()">Cancelar</button>' +
            '<button class="btn btn-primary" style="flex:1" onclick="carroConfirmarPlanejar()">Confirmar</button>' +
          '</div>' +
        '</div></div>' +
        actionsHTML +
        (a ? '<button class="btn btn-danger mt-1" onclick="carroRemoverAviso()">' + icon('trash', 'icon icon-sm') + ' Remover aviso</button>' : '');
    }

    let avisoPlanejarModo = null;

    window.toggleAvisoPlanejar = function(modo) {
      avisoPlanejarModo = modo;
      const box = $('#aviso-planejar');
      const label = $('#aviso-planejar-label');
      const input = $('#aviso-datetime');
      if (!box || !label || !input) return;
      box.classList.remove('hidden');
      label.textContent = modo === 'show' ? 'Aparecer em:' : 'Terminar em:';
      const d = new Date(Date.now() + 60 * 60 * 1000);
      const p = function(n){ return String(n).padStart(2, '0'); };
      input.value = d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
    };

    window.cancelarPlanejar = function() {
      avisoPlanejarModo = null;
      const box = $('#aviso-planejar');
      if (box) box.classList.add('hidden');
    };

    window.carroAvisoPublicarAgora = async function() {
      const message = (($('#aviso-msg') || {}).value || '').trim();
      const place = (($('#aviso-place') || {}).value || '').trim();
      if (!message) return toast.show('Escreva uma mensagem para os clientes.', 'error');
      try {
        const st = await api.put('/api/carro/aviso', { message: message, place: place, showAt: null, hideAt: null });
        carroAdminAviso = st.avisoAdmin;
        carroApply(st);
        renderCarroAdminAviso();
        toast.show('Aviso publicado.');
      } catch (e) { toast.show(e.message, 'error'); }
    };

    window.carroConfirmarPlanejar = async function() {
      if (!avisoPlanejarModo) return;
      const message = (($('#aviso-msg') || {}).value || '').trim();
      const place = (($('#aviso-place') || {}).value || '').trim();
      const dtStr = ($('#aviso-datetime') || {}).value;
      if (!message) return toast.show('Escreva uma mensagem para os clientes.', 'error');
      if (!dtStr) return toast.show('Escolha a data e a hora.', 'error');
      const iso = new Date(dtStr).toISOString();
      const current = carroAdminAviso || {};
      const body = { message: message, place: place };
      if (avisoPlanejarModo === 'show') {
        body.showAt = iso;
        if (current.hideAt && new Date(current.hideAt) > new Date(iso)) body.hideAt = current.hideAt;
      } else {
        body.hideAt = iso;
        if (current.showAt) body.showAt = current.showAt;
      }
      try {
        const st = await api.put('/api/carro/aviso', body);
        carroAdminAviso = st.avisoAdmin;
        carroApply(st);
        avisoPlanejarModo = null;
        renderCarroAdminAviso();
        toast.show('Agendamento salvo.');
      } catch (e) { toast.show(e.message, 'error'); }
    };

    window.carroAvisoTerminarAgora = async function() {
      if (!confirm('Encerrar o aviso agora? Os clientes deixam de ver imediatamente.')) return;
      try {
        const st = await api.del('/api/carro/aviso');
        carroAdminAviso = null;
        carroApply(st);
        renderCarroAdminAviso();
        toast.show('Aviso encerrado.');
      } catch (e) { toast.show(e.message, 'error'); }
    };

    window.carroRemoverAviso = async () => {
      try { const st = await api.del('/api/carro/aviso'); carroAdminAviso = null; carroApply(st); renderCarroAdminAviso(); toast.show('Aviso removido.'); }
      catch (e) { toast.show(e.message, 'error'); }
    };

    function renderAdminHubCarroBadge() {
      const b = $('#hub-carro-badge');
      if (b) b.innerHTML = carroState?.live ? '<span class="carro-badge">no ar</span>' : '';
    }

    // ==========================================================================
    // ADMIN — CLIENTES
    // ==========================================================================
    let adminClientCache = [];
    async function loadAdminClients() {
      try {
        const data = await api.get('/api/admin/clients?limit=50');
        adminClientCache = data.clients;
        if (!$('#admin-clients')) return;
        renderAdminClients(data.clients);
      } catch (e) { toast.show(e.message, 'error'); }
    }

    function clientRowHTML(c) {
      return `
        <div class="client-row">
          <div class="top">
            <div>
              <div class="name">${esc(c.fullName)}</div>
              <div class="phone">${formatPhone(c.phone)}</div>
              ${c.isInactive ? `<span class="inactive-badge">${icon('bell','icon icon-sm')} ${c.weeksInactive} semana${c.weeksInactive === 1 ? '' : 's'} sem carimbar</span>` : ''}
            </div>
            <div class="count">${c.stamps}/10</div>
          </div>
          <div class="actions">
            <button class="btn btn-qr-green" onclick="openStampHub(${jattr(c)})">${icon('card-simple', 'icon icon-sm')} Ajuste manual</button>
            <button class="btn btn-primary" onclick="openSalesHub(${jattr(c)})">${icon('cart', 'icon icon-sm')} Registrar venda</button>
          </div>
          <div class="actions">
            <button class="btn btn-secondary" onclick="resetCard('${c._id}')">${icon('reset', 'icon icon-sm')} Zerar</button>
            <button class="btn btn-outline" onclick="deleteHistory('${c._id}')">${icon('trash', 'icon icon-sm')} Histórico</button>
            <button class="btn btn-outline" style="border-color:#25D36660;color:#1a8a4a" onclick="shareCardWhatsapp(${jattr(c)})">${icon('whatsapp', 'icon icon-sm')} Compartilhar</button>
          </div>
        </div>
      `;
    }

    function renderAdminClients(list) {
      const box = $('#admin-clients');
      if (!box) return;
      if (!list.length) { box.innerHTML = `<div class="empty-state"><p>Nenhum cliente encontrado.</p></div>`; return; }

      const inactive = list.filter(c => c.isInactive);
      const active = list.filter(c => !c.isInactive);

      let html = '';
      if (inactive.length) {
        html += `<h4 class="group-title inactive-title">${icon('bell','icon icon-sm')} Sumidos (2+ semanas sem carimbar) · ${inactive.length}</h4>`;
        html += inactive.map(clientRowHTML).join('');
      }
      if (active.length) {
        if (inactive.length) html += `<h4 class="group-title">${icon('user','icon icon-sm')} Demais clientes</h4>`;
        html += active.map(clientRowHTML).join('');
      }
      box.innerHTML = html;
    }

    window.shareCardWhatsapp = async (client) => {
      try {
        toast.show('Gerando cartão…');
        const temp = document.createElement('div');
        temp.style.cssText = 'position:fixed;left:-9999px;top:0;width:400px;padding:10px;background:#FFE14D';
        temp.innerHTML = officialCardHTML(client.stamps) +
          `<div class="card-status">${cardStatusMessage(client.stamps).text}</div>`;
        document.body.appendChild(temp);
        await Promise.all(Array.from(temp.querySelectorAll('img')).map(img => img.complete ? null : new Promise(r => { img.onload = img.onerror = r; })));
        const canvas = await html2canvas(temp, { backgroundColor: '#FFE14D', scale: 2 });
        document.body.removeChild(temp);

        const isInactive = client.isInactive;
        const firstName = client.fullName.trim().split(/\s+/)[0];
        const message = isInactive
          ? `Saudades suas por aqui, ${firstName}! Faz um tempinho que você não passa pra carimbar seu cartão da Pamonha Net — ele te espera com ${client.stamps} selo${client.stamps === 1 ? '' : 's'}. Vem nos visitar!`
          : `Oi, ${firstName}! Aqui está o seu cartão fidelidade da Pamonha Net — você já tem ${client.stamps} de 10 selos. Continue firme rumo ao prêmio!`;

        canvas.toBlob(async (blob) => {
          const file = new File([blob], 'cartao-pamonha-net.png', { type: 'image/png' });
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], text: message, title: 'Pamonha Net' });
          } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'cartao-pamonha-net.png';
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(url);
            toast.show('Imagem baixada. Anexe no WhatsApp manualmente.');
          }
        }, 'image/png');
      } catch (e) { toast.show('Não foi possível gerar o cartão para compartilhar.', 'error'); }
    };

    // Seletor de destinatário
    let notifAudience = 'all';
    let notifSelectedClient = null;

    window.setAudience = (mode) => {
      notifAudience = mode;
      const all = $('#aud-all'), one = $('#aud-one'), picker = $('#audience-picker');
      if (all) all.classList.toggle('active', mode === 'all');
      if (one) one.classList.toggle('active', mode === 'one');
      if (picker) picker.classList.toggle('hidden', mode !== 'one');
    };

    function matchesClientQuery(c, q) {
      const digits = q.replace(/\D/g, '');
      return c.fullName.toLowerCase().includes(q) || (digits.length > 0 && c.phone.includes(digits));
    }

    window.filterNotifClients = () => {
      const q = $('#notif-client-search') ? $('#notif-client-search').value.trim().toLowerCase() : '';
      const list = $('#notif-client-list');
      if (!list) return;
      if (!q) { list.innerHTML = ''; return; }
      const matches = adminClientCache.filter(c => matchesClientQuery(c, q)).slice(0, 6);
      list.innerHTML = matches.length
        ? matches.map(c => `
            <button class="notif-client-item" onclick="selectNotifClient(${jattr(c._id)}, ${jattr(c.fullName)})">
              <span>${esc(c.fullName)}</span><span class="text-xs muted">${formatPhone(c.phone)}</span>
            </button>
          `).join('')
        : `<p class="text-xs muted p-1">Nenhum cliente encontrado.</p>`;
    };

    window.selectNotifClient = (id, name) => {
      notifSelectedClient = { id, name };
      const list = $('#notif-client-list'); if (list) list.innerHTML = '';
      const search = $('#notif-client-search'); if (search) search.value = '';
      const chip = $('#notif-selected-chip');
      if (chip) chip.innerHTML = `<span class="notif-chip">${esc(name)} <button onclick="clearNotifClient()" aria-label="Remover">×</button></span>`;
    };

    window.clearNotifClient = () => {
      notifSelectedClient = null;
      const chip = $('#notif-selected-chip'); if (chip) chip.innerHTML = '';
    };

    window.searchClients = () => {
      const q = $('#search-clients') ? $('#search-clients').value.trim().toLowerCase() : '';
      const filtered = adminClientCache.filter(c => matchesClientQuery(c, q));
      renderAdminClients(filtered);
    };

    window.resetCard = async (id) => {
      if (!confirm('Tem certeza que deseja zerar o cartão deste cliente?')) return;
      try {
        await api.post('/api/admin/clients/' + id + '/reset');
        toast.show('Cartão zerado.');
        loadAdminClients();
      } catch (e) { toast.show(e.message, 'error'); }
    };
    window.deleteHistory = async (id) => {
      if (!confirm('Apagar todo o histórico de selos deste cliente? Esta ação não pode ser desfeita.')) return;
      try {
        await api.del('/api/admin/clients/' + id + '/history');
        toast.show('Histórico apagado.');
      } catch (e) { toast.show(e.message, 'error'); }
    };

    window.scanQr = async () => {
      const input = $('#qr-scan-input');
      const raw = input ? input.value.trim() : '';
      if (!raw) return toast.show('Cole o conteúdo do QR Code.', 'error');
      try {
        const data = await api.post('/api/admin/scan-qr', { qrToken: raw });
        toast.show(data.message || 'Selo adicionado via QR Code.');

    // ==========================================================================
    // GRÁFICOS — tudo em SVG puro, sem Chart.js

    let graficosAno = null;

    window.setGraficosAno = (ano) => { graficosAno = Number(ano); graficosMes = null; renderAdminGraficos($('#admin-sub') || $('#admin-tab-body')); };

    const MESES_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const MESES_PT_LONG = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    // ===== Gráfico de barras mensal — estilo moderno =====
    function renderWaterfallSVG(posicoes, isMesView) {
      const W = 340, H = 260;
      const padL = 42, padR = 14, padT = 34, padB = 44;
      const chartW = W - padL - padR;
      const chartH = H - padT - padB;
      const maxVal = Math.max(1, ...posicoes.map(p => p.bruto));

      // Grid horizontal com 4 linhas
      let grid = '';
      const steps = 4;
      for (let i = 0; i <= steps; i++) {
        const y = padT + (chartH * i / steps);
        const val = maxVal * (1 - i / steps);
        grid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="rgba(27,94,32,0.08)" stroke-width="1"/>`;
        grid += `<text x="${padL - 6}" y="${y + 3}" text-anchor="end" font-size="8.5" fill="#90A4AE">${Math.round(val)}</text>`;
      }

      const n = posicoes.length;
      const barSlot = chartW / n;
      const barW = Math.max(7, Math.min(barSlot * 0.55, 22));

      let bars = '';
      posicoes.forEach((p, i) => {
        const x = padL + i * barSlot + (barSlot - barW) / 2;
        const liquidoH = (p.liquido / maxVal) * chartH;
        const custoH = (p.custo / maxVal) * chartH;
        const baseY = padT + chartH;

        // Barra do custo (por cima) — vermelho suave
        if (custoH > 0.5) {
          bars += `<rect x="${x}" y="${baseY - liquidoH - custoH}" width="${barW}" height="${custoH}" fill="#E57373" rx="3"/>`;
        }
        // Barra do líquido — dourado suave
        if (liquidoH > 0.5) {
          bars += `<rect x="${x}" y="${baseY - liquidoH}" width="${barW}" height="${liquidoH}" fill="#F9A825" rx="3"/>`;
        }

        // Área clicável do mês
        const clickable = !isMesView && p.vendas > 0;
        bars += `<rect x="${x - 4}" y="${padT}" width="${barW + 8}" height="${chartH}" fill="transparent" style="cursor:${clickable ? 'pointer' : 'default'}"${clickable ? ` onclick="drillGraficosMes(${i + 1})"` : ''}/>`;

        // Valor total em cima (só se couber)
        const totalH = liquidoH + custoH;
        if (totalH > 14 && p.bruto > 0) {
          bars += `<text x="${x + barW / 2}" y="${baseY - totalH - 5}" text-anchor="middle" font-size="8" font-weight="700" fill="#1B5E20">${Math.round(p.bruto)}</text>`;
        }

        // Label do mês embaixo
        bars += `<text x="${x + barW / 2}" y="${H - padB + 16}" text-anchor="middle" font-size="10" fill="#263238" font-weight="600">${p.label}</text>`;
      });

      // Legenda
      const legY = 14;
      let legend = `<g transform="translate(${padL},${legY})">`;
      legend += `<rect x="0" y="-8" width="10" height="10" fill="#F9A825" rx="2"/><text x="15" y="1" font-size="10" fill="#263238">Líquido</text>`;
      legend += `<rect x="70" y="-8" width="10" height="10" fill="#E57373" rx="2"/><text x="85" y="1" font-size="10" fill="#263238">Custo</text>`;
      legend += `</g>`;

      return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">${grid}${bars}${legend}</svg>`;
    }

    // ===== Donut de satisfação — mais elegante =====
    function renderPizzaSVG(sat) {
      const dist = [1,2,3,4,5].map(function(n){
        const found = (sat.distribuicaoPorNota || []).find(function(d){ return d.nota === n; });
        return found ? found.quantidade : 0;
      });
      const total = dist.reduce(function(s,v){ return s+v; }, 0);
      const size = 130, stroke = 20;
      const radius = (size - stroke) / 2;
      const cx = size / 2, cy = size / 2;
      const circumference = 2 * Math.PI * radius;
      const colors = ['#C62828', '#E57373', '#F9A825', '#8BC34A', '#2E7D32'];

      let slices = '';
      if (total === 0) {
        slices = `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="#E8F5E9" stroke-width="${stroke}"/>`;
      } else {
        let offset = 0;
        dist.forEach(function(qty, i){
          if (qty === 0) return;
          const fraction = qty / total;
          const dash = fraction * circumference;
          const gap = circumference - dash;
          slices += `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${colors[i]}" stroke-width="${stroke}" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
          offset += dash;
        });
      }
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${slices}</svg>`;
    }

    // ===== Barras horizontais =====
    function svgHBarChart(data, opts) {
      const { valueFmt = (v) => String(v), color = 'var(--husk-700)' } = opts || {};
      const width = 320, rowH = 34, gap = 12, labelW = 100;
      const barAreaW = width - labelW - 54;
      const max = Math.max(1, ...data.map((d) => d.value));
      const height = data.length * (rowH + gap) - gap + 6;
      const rows = data.map((d, i) => {
        const y = i * (rowH + gap);
        const barW = Math.max(4, (d.value / max) * barAreaW);
        return `
          <text x="${labelW - 8}" y="${y + rowH / 2 + 4}" text-anchor="end" font-size="11" font-weight="600" fill="#263238" font-family="var(--font-body)">${esc(d.label)}</text>
          <rect x="${labelW}" y="${y + 5}" width="${barAreaW}" height="${rowH - 10}" rx="${(rowH - 10) / 2}" fill="rgba(27,94,32,0.08)" />
          <rect x="${labelW}" y="${y + 5}" width="${barW}" height="${rowH - 10}" rx="${(rowH - 10) / 2}" fill="${color}" />
          <text x="${labelW + barAreaW + 8}" y="${y + rowH / 2 + 4}" font-size="11" font-weight="700" fill="var(--gold-700)" font-family="var(--font-body)">${valueFmt(d.value)}</text>
        `;
      }).join('');
      return `<svg class="bar-chart-svg" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">${rows}</svg>`;
    }

    // ===== Barras agrupadas (bruto + líquido) =====
    function svgGroupedBarChart(data) {
      const width = 320, rowH = 52, gap = 16, labelW = 100, subH = 14, subGap = 5;
      const barAreaW = width - labelW - 66;
      const max = Math.max(1, ...data.flatMap((d) => [d.bruto, d.liquido]));
      const height = data.length * (rowH + gap) - gap + 6;
      const rows = data.map((d, i) => {
        const y = i * (rowH + gap);
        const wBruto = Math.max(4, (d.bruto / max) * barAreaW);
        const wLiquido = Math.max(4, (d.liquido / max) * barAreaW);
        return `
          <text x="${labelW - 8}" y="${y + rowH / 2 + 4}" text-anchor="end" font-size="11" font-weight="600" fill="#263238" font-family="var(--font-body)">${esc(d.label)}</text>
          <rect x="${labelW}" y="${y + 2}" width="${barAreaW}" height="${subH}" rx="${subH / 2}" fill="rgba(27,94,32,0.08)" />
          <rect x="${labelW}" y="${y + 2}" width="${wBruto}" height="${subH}" rx="${subH / 2}" fill="#2E7D32" />
          <text x="${labelW + barAreaW + 8}" y="${y + 2 + subH - 3}" font-size="10" font-weight="700" fill="#1B5E20" font-family="var(--font-body)">R$ ${fmtMoney(d.bruto)}</text>
          <rect x="${labelW}" y="${y + 2 + subH + subGap}" width="${barAreaW}" height="${subH}" rx="${subH / 2}" fill="rgba(249,168,37,0.18)" />
          <rect x="${labelW}" y="${y + 2 + subH + subGap}" width="${wLiquido}" height="${subH}" rx="${subH / 2}" fill="#F9A825" />
          <text x="${labelW + barAreaW + 8}" y="${y + 2 + subH + subGap + subH - 3}" font-size="10" font-weight="700" fill="#E65100" font-family="var(--font-body)">R$ ${fmtMoney(d.liquido)}</text>
        `;
      }).join('');
      return `<svg class="bar-chart-svg" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">${rows}</svg>`;
    }
    function fmtMoney(v) { return (v || 0).toFixed(2).replace('.', ','); }
    function fmtMoneyFull(v) { return 'R$ ' + fmtMoney(v); }

    async function renderAdminGraficos(container) {
      if (!container) return;
      container.innerHTML = `<div class="loader"></div>`;
      try {
        const anosData = await api.get('/api/admin/graficos/anos');

    function drawGraficos(container, anos, fatData, sat, cartoesData, fatLocalData) {
      const totais = fatData.totais || { bruto: 0, custo: 0, liquido: 0, vendas: 0, cartoesFechados: 0 };
      const medias = fatData.medias || {};
      const posicoes = fatData.posicoes || [];

      const breadcrumb = isMesView
        ? `<button class="breadcrumb-back" onclick="voltarGraficosAno()">${icon('logout','icon icon-sm')}</button><span>${graficosAno} ▸ ${MESES_PT_LONG[graficosMes - 1]}</span>`
        : `<span>${graficosAno}</span>`;

      const cartoesBody = (cartoesData.porLocal || []).length
        ? svgHBarChart(cartoesData.porLocal.map((r) => ({ label: r.local, value: r.cartoesFechados })), { valueFmt: (v) => String(v), color: 'var(--green)' })
        : `<p class="text-sm muted">Nenhum cartão fechado neste período.</p>`;

      const fatLocalBody = (fatLocalData.porLocal || []).length
        ? svgGroupedBarChart(fatLocalData.porLocal.map((r) => ({ label: r.local, bruto: r.faturamentoBruto ?? r.bruto, liquido: r.faturamentoLiquido ?? r.liquido })))
        : `<p class="text-sm muted">Nenhuma venda neste período.</p>`;

      container.innerHTML = `
        <div class="surface section-gap">
          <div class="chart-head">
            <select class="input" id="graficos-ano-select" style="width:auto" onchange="setGraficosAno(this.value)">
              ${anos.map(a => `<option value="${a}" ${a === graficosAno ? 'selected' : ''}>${a}</option>`).join('')}
            </select>
          </div>
          <div class="stat-grid mt-1">
            <div class="stat-box"><div class="num">R$ ${fmtMoney(totais.bruto)}</div><div class="lbl">Bruto</div></div>
            <div class="stat-box"><div class="num" style="color:var(--danger)">R$ ${fmtMoney(totais.custo)}</div><div class="lbl">Custo</div></div>
            <div class="stat-box"><div class="num" style="color:var(--amber-dark)">R$ ${fmtMoney(totais.liquido)}</div><div class="lbl">Líquido</div></div>
          </div>
          <div class="stat-grid">
            <div class="stat-box"><div class="num">${totais.vendas || 0}</div><div class="lbl">Vendas</div></div>
            <div class="stat-box"><div class="num">${totais.cartoesFechados || 0}</div><div class="lbl">Cartões fechados</div></div>
            <div class="stat-box"><div class="num">R$ ${fmtMoney(isMesView ? (medias.porSemana ?? medias.media) : (medias.porMes ?? medias.media))}</div><div class="lbl">${isMesView ? 'Média/semana' : 'Média/mês'}</div></div>
          </div>

          <div class="chart-head">
            <h3 class="surface-title">${icon('chart','icon icon-sm')} Faturamento</h3>
            <div class="breadcrumb">${breadcrumb}</div>
          </div>
          <div class="waterfall-wrap">${renderWaterfallSVG(posicoes, isMesView)}</div>
          <p class="text-xs muted text-center mt-1">${isMesView ? 'Semanas do mês — o valor total aparece em cima de cada barra.' : 'Toque em um mês para abrir as semanas.'}</p>
        </div>

        <div class="surface section-gap">
          <h3 class="surface-title">${icon('star','icon icon-sm')} Avaliações</h3>
          ${!sat.totalAvaliacoes ? `<p class="text-sm muted">Nenhuma avaliação ainda.</p>` : `
            <div class="pizza-wrap">
              <div style="position:relative;flex-shrink:0">
                ${renderPizzaSVG(sat)}
                <div class="pizza-center"><strong>${sat.percentualSatisfeitos ?? 0}%</strong><span>satisfeitos</span></div>
              </div>
              <div class="chart-legend">

    async function loadRaspadinhasStats() {
      const box = $('#rasp-stats');
      if (!box) return;
      try {
        const s = await api.get('/api/admin/raspadinhas/stats');
        box.innerHTML = `
          <div class="stat-box"><div class="num">${s.total}</div><div class="lbl">Total</div></div>
          <div class="stat-box"><div class="num" style="color:var(--husk-700)">${s.ativas}</div><div class="lbl">Ativas</div></div>

    window.filtrarRaspadinhas = (status) => { loadRaspadinhas(status); };

    async function loadRaspadinhas(status) {
      const box = $('#rasp-list');
      if (!box) return;
      box.innerHTML = `<div class="loader"></div>`;
      try {
        const data = await api.get('/api/admin/raspadinhas?status=' + status);
        const list = data.raspadinhas || [];
        if (!list.length) { box.innerHTML = `<div class="empty-state"><p>Nenhuma raspadinha neste filtro.</p></div>`; return; }
        box.innerHTML = list.map(r => {
          const statusTxt=r.status==='active'?'Ativa':r.status==='used'?'Usada':'Cancelada';
          const statusColor=r.status==='active'?'var(--husk-700)':r.status==='used'?'var(--ink-soft)':'var(--error)';
          const contaExcluida=!r.userId, cli=contaExcluida?'Conta excluída':r.userId.fullName;
          const cliPhone=!contaExcluida&&r.userId.phone?formatPhone(r.userId.phone):'';
          const avisoExcluida=contaExcluida&&r.status==='active'?`<div style="font-size:.75rem;color:var(--error);margin-top:.3rem">⚠ O cliente apagou a conta. Este prêmio não pode mais ser resgatado. Cancele para limpar.</div>`:'';
          const btnCancelar=r.status==='active'?`<button class="btn btn-outline mt-1" style="color:var(--error);border-color:rgba(198,40,40,.35);width:100%" onclick="abrirCancelarRaspadinha('${r._id}', '${esc(r.code)}')">${icon('trash','icon icon-sm')} Cancelar prêmio</button>`:'';
          const btnExcluir = r.status !== 'active'
            ? `<button class="btn btn-outline mt-1" style="color:var(--error);border-color:rgba(198,40,40,.35);width:100%" onclick="abrirExcluirRaspadinha('${r._id}', '${esc(r.code)}')">${icon('trash','icon icon-sm')} Excluir do histórico</button>`
            : '';
          return `<div class="venda-row"><div class="top"><div><div class="client">${esc(cli)}</div><div class="meta">${esc(cliPhone)}${cliPhone?' · ':''}${formatDate(r.createdAt)}</div></div><div class="value" style="color:${statusColor}">${r.discountPercent}%</div></div><div style="font-family:monospace;font-size:1.05rem;font-weight:700;color:var(--husk-900);letter-spacing:.06em;margin:.4rem 0">${esc(r.code)}</div><span class="venda-badge ${r.status==='active'?'ok':'warn'}">${statusTxt}${r.usedAt?' · '+formatDateShort(r.usedAt):''}</span>${avisoExcluida}${btnCancelar}${btnExcluir}</div>`;

      const q=input.value.trim(); if(q.length<3){box.classList.remove('show');box.innerHTML='';return;}
      box.innerHTML=`<div style="padding:.75rem .9rem;font-size:.82rem;color:var(--ink-soft)">Buscando…</div>`;box.classList.add('show');

    };
    window.escolherLocalBuscadoIdx = (idx) => {const box=$('#local-search-results');if(!box||!box._resultados)return;const r=box._resultados[idx];if(!r)return;setLocalLatLng(r.lat,r.lng);if(localMapInstance&&localMapMarker){localMapInstance.setView([r.lat,r.lng],17);localMapMarker.setLatLng([r.lat,r.lng]);if(localMapCircle)localMapCircle.setLatLng([r.lat,r.lng]);}const nameEl=$('#local-name');if(nameEl&&!nameEl.value.trim())nameEl.value=r.shortLabel||'';const addr=$('#local-found-address');if(addr){addr.innerHTML=`${icon('check','icon icon-sm')} <span>${esc(r.displayName)}</span>`;addr.classList.remove('hidden');}box.classList.remove('show');box.innerHTML='';box._resultados=null;$('#local-search').blur();};

    function initLocalMap(lat, lng) {
      const el = $('#local-map');
      if (!el || typeof L === 'undefined') return;
      if (localMapInstance) { localMapInstance.remove(); localMapInstance = null; }
      localMapInstance = L.map(el, { attributionControl: false }).setView([lat, lng], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(localMapInstance);
      localMapMarker = L.marker([lat, lng], { draggable: true }).addTo(localMapInstance);
      localMapCircle = L.circle([lat, lng], { radius: 150, color: '#2E7D32', fillColor: '#2E7D32', fillOpacity: 0.15 }).addTo(localMapInstance);
      localMapMarker.on('drag', (e) => {
        const p = e.target.getLatLng();
        localMapCircle.setLatLng(p);
        setLocalLatLng(p.lat, p.lng);
      });
      localMapInstance.on('click', (e) => {
        localMapMarker.setLatLng(e.latlng);
        localMapCircle.setLatLng(e.latlng);
        setLocalLatLng(e.latlng.lat, e.latlng.lng);
      });
      setLocalLatLng(lat, lng);
    }

    function setLocalLatLng(lat, lng) {
      const latEl = $('#local-lat'), lngEl = $('#local-lng');

        ? `${icon('cart','icon icon-sm')} Venda avulsa`
        : `${icon('cart','icon icon-sm')} Venda para ${esc(salesCartClient.fullName.split(' ')[0])}`;
      const btn = $('#sales-hub-confirm-btn');
      if (btn) btn.innerHTML = `${icon('check','icon icon-sm')} ${salesAvulsa ? 'Registrar venda avulsa' : 'Confirmar venda'}`;
      const localBox = $('#sales-avulsa-local');
      if (localBox) {
        localBox.classList.toggle('hidden', !salesAvulsa);
        if (salesAvulsa) {
          localBox.innerHTML = `
            <label class="label">Local da venda</label>
            <select class="input mb-1" id="sales-avulsa-local-select" onchange="salesAvulsaLocalId = this.value">
              <option value="">Selecione um local cadastrado…</option>
              ${locaisCache.filter(l => l.active).map(l => `<option value="${l._id}" ${salesAvulsaLocalId === l._id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}
            </select>
            <button class="btn btn-outline" onclick="useMyLocationForSalesAvulsa()">${icon('pin','icon icon-sm')} Usar GPS (opcional)</button>
            ${salesAvulsaCoords ? `<p class="text-xs muted mt-1">${icon('check','icon icon-sm')} Localização GPS capturada.</p>` : `<p class="text-xs muted mt-1">Se não escolher nem usar GPS, a venda fica como <strong>local não identificado</strong> — entra nos gráficos totais normalmente.</p>`}
          `;
        }
      }
    }

    window.toggleSalesAvulsa = (checked) => { salesAvulsa = checked; renderSalesHubHead(); };

    window.useMyLocationForSalesAvulsa = () => {
      if (!navigator.geolocation) return toast.show('Este dispositivo não tem GPS disponível.', 'error');
      toast.show('Buscando sua localização…');
      navigator.geolocation.getCurrentPosition(
        (pos) => { salesAvulsaCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude }; toast.show('Localização capturada.'); renderSalesHubHead(); },
        () => toast.show('Não foi possível obter sua localização.', 'error'),
        { enableHighAccuracy: true, timeout: 8000 }
      );
    };

    function salesCartListHTML() {
      const activeProdutos = produtosCache.filter(p => p.active);
      if (!activeProdutos.length) return `<p class="text-sm muted text-center">Nenhum produto ativo cadastrado. Cadastre em Produtos.</p>`;
      return activeProdutos.map(p => `
        <div class="cart-row">
          <div class="info"><strong>${esc(p.name)}</strong><span>R$ ${p.price.toFixed(2).replace('.', ',')}</span></div>
          <div class="qty-stepper">
            <button onclick="changeCartQty('${p._id}', -1)">${icon('minus','icon')}</button>
            <span class="qty-val" id="cart-qty-${p._id}">${salesCart[p._id] || 0}</span>
            <button onclick="changeCartQty('${p._id}', 1)">${icon('plus','icon')}</button>
          </div>
        </div>
      `).join('');
    }

    window.changeCartQty = (produtoId, delta) => {
      const current = salesCart[produtoId] || 0;
      const next = Math.max(0, current + delta);
      if (next === 0) delete salesCart[produtoId]; else salesCart[produtoId] = next;
      const el = $('#cart-qty-' + produtoId);
      if (el) el.textContent = next;
      updateSalesCartTotals();
    };

    function updateSalesCartTotals() {
      let total = 0, stamps = 0;
      for (const [id, qty] of Object.entries(salesCart)) {
        const p = produtosCache.find(pp => pp._id === id);
        if (!p) continue;
        total += p.price * qty;
        stamps += qty;
      }
      const totalEl = $('#sales-cart-total'); if (totalEl) totalEl.textContent = 'R$ ' + total.toFixed(2).replace('.', ',');
      const stampsEl = $('#sales-cart-stamps');
      if (stampsEl) stampsEl.textContent = salesAvulsa ? 'Venda avulsa — não dá selos' : `${stamps} selo${stamps === 1 ? '' : 's'} nesta venda`;
    }

    window.closeSalesHub = () => {
      const el = $('#sales-hub-overlay'); if (el) el.remove();
      salesCartClient = null; salesCart = {}; salesAvulsa = false; salesAvulsaLocalId = ''; salesAvulsaCoords = null;
    };

    window.confirmSalesHub = async () => {
      const items = Object.entries(salesCart).map(([produtoId, quantity]) => ({ produtoId, quantity }));
      if (!items.length) return toast.show('Escolha ao menos 1 produto.', 'error');
      // v10.4.9: GPS/local agora é opcional. Venda avulsa sem local entra como "não identificado".

      let coords = salesAvulsa ? salesAvulsaCoords : null;
      if (!salesAvulsa && navigator.geolocation) {
        coords = await new Promise((resolve) => {
          navigator.geolocation.getCurrentPosition(
            (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
            () => resolve(null),
            { enableHighAccuracy: true, timeout: 6000 }
          );
        });
      }

      try {
        const body = { items };
        if (salesAvulsa) {
          body.clientId = null;
          if (salesAvulsaLocalId) body.localId = salesAvulsaLocalId;
          else if (coords) { body.lat = coords.lat; body.lng = coords.lng; }
        } else {
          body.clientId = salesCartClient._id;
          if (coords) { body.lat = coords.lat; body.lng = coords.lng; }
        }
        const data = await api.post('/api/admin/vendas', body);
        const overflowMsg = data.overflowStamps > 0 ? ` (${data.overflowStamps} selo(s) não contaram — cartão já estava cheio)` : '';
        const msg = salesAvulsa ? 'Venda avulsa registrada.' : `Venda registrada: ${data.venda?.stampsGiven ?? 0} selo(s).${overflowMsg}`;
        toast.show(msg);
        closeSalesHub();
        loadAdminClients();
        if (data.needsLocation) openLocationPicker(data.nearestLocais, coords, data.venda._id);
      } catch (e) { toast.show(e.message, 'error'); }
    };

    function openLocationPicker(nearest, coords, vendaId) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'location-picker-overlay';
      const nearestHTML = nearest && nearest.length
        ? `<p class="text-xs muted mb-1">Locais cadastrados mais próximos — toque para usar um deles:</p>` + nearest.map(n => `
            <div class="cleanup-row">
              <div><strong>${esc(n.name)}</strong><span>${Math.round(n.distanceMeters)}m de distância</span></div>
              <button class="btn btn-primary" onclick='confirmAssignLocal("${vendaId}", "${n.localId}"); closeLocationPicker()'>Usar</button>
            </div>
          `).join('')
        : `<p class="text-xs muted mb-1">Nenhum local cadastrado perto daqui.</p>`;
      overlay.innerHTML = `
        <div class="modal-card">
          <h3 class="surface-title">${icon('map','icon icon-sm')} Local não identificado</h3>
          <p class="text-sm mb-1">Esta venda ficou sem local vinculado — está fora do raio de todos os locais cadastrados. Ela conta normalmente nos selos e no faturamento total, só não aparece nos gráficos por local até você vincular um.</p>
          ${nearestHTML}
          <div class="flex gap-1 mt-2">
            <button class="btn btn-outline" style="flex:1" onclick="closeLocationPicker()">Deixar sem local</button>
            ${coords ? `<button class="btn btn-primary" style="flex:1" onclick='closeLocationPicker(); goRegisterLocal(${coords.lat}, ${coords.lng})'>${icon('plus','icon icon-sm')} Cadastrar local aqui</button>` : ''}
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }
    window.closeLocationPicker = () => { const el = $('#location-picker-overlay'); if (el) el.remove(); };
    window.goRegisterLocal = (lat, lng) => {
      router.go('admin', true);
      adminActiveTab = 'locais';
      renderAdminTabBody();
      setTimeout(() => {
        setLocalLatLng(lat, lng);
        if (localMapInstance && localMapMarker) {
          localMapInstance.setView([lat, lng], 16);
          localMapMarker.setLatLng([lat, lng]);
          if (localMapCircle) localMapCircle.setLatLng([lat, lng]);
        }
      }, 80);
    };

    // ==========================================================================
    // LIMPEZA
    // ==========================================================================
    async function renderLimpeza(container) {
      container.innerHTML = `<div class="loader"></div>`;
      try {
        if (!vendasCache.length) { const v = await api.get('/api/admin/vendas?limit=100'); vendasCache = v.vendas; }
        if (!adminFeedbacksCache.length) { const f = await api.get('/api/admin/feedbacks'); adminFeedbacksCache = f.feedbacks; }
      } catch (e) { /* segue com o que tiver em cache */ }

      container.innerHTML = `
        <div class="surface section-gap">
          <h3 class="surface-title">${icon('box','icon icon-sm')} Apagar vendas selecionadas</h3>
          <div class="limpeza-list">
            ${vendasCache.slice(0, 30).map(v => `
              <label class="limpeza-item"><input type="checkbox" class="limpeza-venda-chk" value="${v._id}" />
                <span>${esc((v.clientId && v.clientId.fullName) || 'Venda avulsa')} · R$ ${v.totalValue.toFixed(2).replace('.', ',')} · ${formatDateShort(v.createdAt)}</span>
              </label>
            `).join('') || '<p class="text-sm muted">Nenhuma venda.</p>'}
          </div>
          <button class="btn btn-danger mt-1" onclick="limparEscopo('vendas')">${icon('trash','icon icon-sm')} Apagar selecionadas</button>
        </div>

        <div class="surface section-gap">
          <h3 class="surface-title">${icon('star','icon icon-sm')} Apagar avaliações selecionadas</h3>
          <div class="limpeza-list">
            ${adminFeedbacksCache.slice(0, 30).map(f => `
              <label class="limpeza-item"><input type="checkbox" class="limpeza-avaliacao-chk" value="${f._id}" />
                <span>${esc((f.userId && f.userId.fullName) || 'Cliente')} · média ${f.average ?? '-'} · ${formatDateShort(f.createdAt)}</span>
              </label>
            `).join('') || '<p class="text-sm muted">Nenhuma avaliação.</p>'}
          </div>
          <button class="btn btn-danger mt-1" onclick="limparEscopo('avaliacoes')">${icon('trash','icon icon-sm')} Apagar selecionadas</button>
        </div>

        <div class="surface section-gap">
          <h3 class="surface-title">${icon('broom','icon icon-sm')} Período visualizado</h3>
          <p class="text-xs muted mb-1">Apaga vendas e avaliações de ${graficosMes ? MESES_PT_LONG[graficosMes-1] + '/' : ''}${graficosAno || 'todo o período'}.</p>
          <button class="btn btn-danger" onclick="limparEscopo('periodo')">Apagar dados do período visualizado</button>
        </div>

        <div class="surface section-gap">
          <h3 class="surface-title">${icon('reset','icon icon-sm')} Cartões</h3>
          <button class="btn btn-danger" onclick="limparEscopo('cartoes')">Zerar contagem de cartões</button>
        </div>

        <div class="surface" style="border-color:rgba(198,40,40,0.5);background:rgba(198,40,40,0.05)">
          <h3 class="surface-title" style="color:var(--danger)">${icon('trash','icon icon-sm')} Zona vermelha</h3>
          <p class="text-sm mb-1">Apaga <strong>todos</strong> os dados: vendas, avaliações, produtos, locais e contagem de cartões. Não pode ser desfeito.</p>
          <label class="label">Digite APAGAR TUDO para confirmar</label>
          <input class="input mb-1" id="limpeza-confirm-word" placeholder="APAGAR TUDO" />
          <button class="btn btn-danger" onclick="limparEscopo('tudo')">Apagar TUDO</button>
        </div>
      `;
    }

    window.limparEscopo = async (escopo) => {
      const body = { escopo };
      if (escopo === 'vendas') {
        body.vendaIds = $$('.limpeza-venda-chk:checked').map(el => el.value);
        if (!body.vendaIds.length) return toast.show('Selecione ao menos uma venda.', 'error');
      } else if (escopo === 'avaliacoes') {
        body.avaliacaoIds = $$('.limpeza-avaliacao-chk:checked').map(el => el.value);
        if (!body.avaliacaoIds.length) return toast.show('Selecione ao menos uma avaliação.', 'error');
      } else if (escopo === 'periodo') {
        body.ano = graficosAno; if (graficosMes) body.mes = graficosMes;
      } else if (escopo === 'tudo') {
        const input = $('#limpeza-confirm-word');
        const word = input ? input.value.trim() : '';
        if (word !== 'APAGAR TUDO') return toast.show('Digite APAGAR TUDO para confirmar.', 'error');
        body.confirmCode = word;
      }
      if (!confirm('Tem certeza? Esta ação não pode ser desfeita.')) return;
      try {
        const data = await api.post('/api/admin/limpeza', body);
        toast.show(`Removido(s): ${data.removidos ?? 'concluído'}.`);
        vendasCache = []; adminFeedbacksCache = [];
        renderLimpeza($('#admin-sub') || $('#admin-tab-body'));
      } catch (e) { toast.show(e.message, 'error'); }
    };

    // ==========================================================================
    // INIT
    // ==========================================================================
    async function init() {
      updateNav();
      registerServiceWorker();

      const params = new URLSearchParams(location.search);
      const resetToken = params.get('reset');
      const scanToken = params.get('scan');

      if (api.token) {
        try {
          const data = await api.get('/api/auth/me');
          api.setAuth(api.token, data.user);
          updateNav();
          connectLiveEvents();
        } catch (e) {
          api.clearAuth();
          updateNav();
        }
      }

      if (resetToken) {
        router.go('reset', true);
        return;
      }

      if (scanToken) {
        history.replaceState(null, '', location.pathname);
        if (api.token && api.user?.role === 'admin') {
          await handleScanResult(scanToken);
          router.go('admin', true);
        } else if (!api.token) {
          toast.show('Entre como administrador para confirmar este carimbo.', 'error');
          router.go('login', true);
        } else {
          toast.show('Só administradores podem confirmar carimbos por QR Code.', 'error');
          router.go('card', true);
        }
        return;
      }

      if (!api.token) {
        router.go('landing', true);
        return;
      }

      const authOnlyPages = ['login', 'register', 'forgot', 'reset'];
      if (authOnlyPages.includes(location.hash.replace('#', ''))) {
        history.replaceState(null, '', location.pathname + '#card');
      }

      maybeShowSplash();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
